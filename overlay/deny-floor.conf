# The owner's deny-floor extras, appended to global/deny-floor.conf (ADR-0016). Same grammar.
#
# These are not generic: they follow the owner's way of working, where a merge to the trunk is the
# deploy and tags and releases are cut by CI. They came from
# the irreversible-action rules of his plugin's permission guard (ADR-0016, 2026-10-05 amendment), so
# the protection stays once the plugin drops its copy. An adopter who works differently leaves this
# file out (install.sh --overlay=none, or an overlay without it).
#
# A prefix sees only these exact spellings. "git push" while the trunk is checked out, another remote
# name or "git -C <dir> push" is not caught (ADR-0016, the amendment's gap list), except the
# "git -C <checkout>" glob entries below for the owner's two checkouts (Issue #466).

# --- The trunk is the deploy: push it only through a merged pull request -------------------------
cmd git push origin main
cmd git push origin master
cmd git push origin HEAD:main
cmd git push origin HEAD:master
cmd git push origin :main
cmd git push origin :master
cmd git push origin --delete main
cmd git push origin --delete master
cmd git push --all
# Issue #83: the upstream-setting and refspec forms. "origin main" above does not reach "main:main",
# and "-u" or "--set-upstream" moves the remote out of the prefix position.
cmd git push origin main:main
cmd git push origin master:master
cmd git push -u origin main
cmd git push -u origin master
cmd git push -u origin HEAD:main
cmd git push -u origin HEAD:master
cmd git push --set-upstream origin main
cmd git push --set-upstream origin master
cmd git push --set-upstream origin HEAD:main
cmd git push --set-upstream origin HEAD:master
# #130 (owner, 2026-10-12, "Regra no piso"): the plugin's trunk-push guard leaves with the plugin, so the
# spellings above were measured on the installed floor and these, which they missed, were added: a forced
# refspec ("+main" force-pushes the trunk) and the fully qualified ref. Still NOT caught: a bare "git push"
# or "git push origin" while the trunk is checked out, "git -C <dir> push", another remote name, a flag
# before the remote ("git push -q origin main"), "git -c k=v push", a wrapper or a script.
cmd git push origin +main
cmd git push origin +master
cmd git push origin refs/heads/main
cmd git push origin refs/heads/master
cmd git push origin HEAD:refs/heads/main
cmd git push origin HEAD:refs/heads/master

# --- The trunk push through "git -C <checkout>", for the owner's own checkouts (Issue #466) -------
# A prefix starts at the program name, so "git -C <dir> push origin main" escapes every entry above.
# Until 2026-11-08 the plugin's guard caught it; these replace it for the two checkouts whose main
# branch deploys or publishes. They are glob entries, so they render for Claude Code and Kiro only:
# Codex gets none (a prefix_rule token is exact, and an absolute path does not belong in Codex rules).
# Claude Code reads the trailing "*" as ".*" over the whole command, anchored at both ends (read from
# the 2.1.319 bundle), so "main*" also matches plain "main", "main:main", "main --force" and, over-
# blocking, a branch named "main-x". The path is matched as typed: each checkout is listed with and
# without a trailing slash. NOT caught: "~", "$HOME" or a relative path ("git -C . push"), another
# path to the same checkout (a symlink, "/private/..."), a flag before "push" or before the remote
# ("git -C <dir> -c k=v push", "git -C <dir> push -q origin main"), another remote name, a bare
# "git -C <dir> push" with main checked out, a wrapper or a script.
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin HEAD:main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin HEAD:refs/heads/main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin refs/heads/main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin +main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin :main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push origin --delete main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push -u origin main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push -u origin HEAD:main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push --set-upstream origin main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push --set-upstream origin HEAD:main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io push --all*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin HEAD:main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin HEAD:refs/heads/main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin refs/heads/main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin +main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin :main*
glob git -C /Users/tadeumen/git-reps/tadeumendonca-io/ push origin --delete main*
