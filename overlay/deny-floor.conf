# The owner's deny-floor extras, appended to global/deny-floor.conf (ADR-0016). Same grammar.
#
# These are not generic: they follow the owner's way of working, where a merge to the trunk is the
# deploy and tags and releases are cut by CI. They came from
# the irreversible-action rules of his plugin's permission guard (ADR-0016, 2026-10-05 amendment), so
# the protection stays once the plugin drops its copy. An adopter who works differently leaves this
# file out (install.sh --overlay=none, or an overlay without it).
#
# A prefix sees only these exact spellings. "git push" while the trunk is checked out, another remote
# name or "git -C <dir> push" is not caught (ADR-0016, the amendment's gap list).

# --- The trunk is the deploy: push it only through a merged pull request -------------------------
cmd git push origin main
cmd git push origin master
cmd git push origin HEAD:main
cmd git push origin HEAD:master
cmd git push origin :main
cmd git push origin :master
cmd git push origin --delete main
cmd git push origin --delete master
cmd git push --all
# Issue #83: the upstream-setting and refspec forms. "origin main" above does not reach "main:main",
# and "-u" or "--set-upstream" moves the remote out of the prefix position.
cmd git push origin main:main
cmd git push origin master:master
cmd git push -u origin main
cmd git push -u origin master
cmd git push -u origin HEAD:main
cmd git push -u origin HEAD:master
cmd git push --set-upstream origin main
cmd git push --set-upstream origin master
cmd git push --set-upstream origin HEAD:main
cmd git push --set-upstream origin HEAD:master

# --- Tags and releases are cut by CI, never pushed by hand ---------------------------------------
cmd git push --tags
cmd git push --follow-tags
