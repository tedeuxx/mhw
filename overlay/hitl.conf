# Owner overlay for the reference installation (ADR-0013). Appended after global/hitl.conf.
# An adopter replaces this directory with their own, or installs with --overlay=none.
#
# "the activation is a tweet at most" (owner). 280 is X's post limit: the number is a proposed
# reading of his words, not his words.
max_question_chars=280
#
# He converses in Portuguese, so the refusal notice he sees is in Portuguese.
notice_count=Guarda HITL (ADR-0013) recusou um seletor antes de exibir: {count} perguntas, limite {max} (uma pergunta por ativação). Mitigação: o agente refaz só a primeira pergunta.
notice_length=Guarda HITL (ADR-0013) recusou um seletor antes de exibir: uma pergunta de {chars} caracteres, limite {max} (ativação do tamanho de um tweet). Mitigação: o agente refaz a pergunta mais curta.
