# Owner overlay for the clipboard guard (ADR-0011). Appended after global/clipboard.conf. It carries NO
# terms: the term list lives only in the untracked local overlay outside this repository.
#
# He converses in Portuguese, so the notices he sees are in Portuguese. The category names inside
# {categories} stay in English. These are the agent's wording, not his.
title=Firewall da estação de trabalho
button_keep=Manter
button_clear=Apagar
button_clean=Limpar
notice_offer=Verificação da área de transferência (ADR-0011): {categories} no item copiado. Nada foi alterado: Limpar troca por uma cópia redigida, Apagar esvazia a área de transferência, Manter deixa como está.
notice_cleaned=Verificação da área de transferência (ADR-0011): {categories} no item copiado. Mitigação: trocado por uma cópia redigida em texto simples.
notice_cleared=Verificação da área de transferência (ADR-0011): {categories} no item copiado. Mitigação: área de transferência apagada.
notice_changed=Verificação da área de transferência (ADR-0011): {categories} num item copiado, mas a área de transferência mudou antes da mitigação. Mitigação: nenhuma aplicada.
notice_too_large=Verificação da área de transferência (ADR-0011): um item copiado com mais de {max} bytes NÃO foi verificado.
notice_error=Verificação da área de transferência (ADR-0011): erro do vigia ({error}); o item copiado NÃO foi verificado.
notice_no_salt=Verificação da área de transferência (ADR-0011): a lista de termos existe mas o sal não foi encontrado, então a detecção de termos de empregador e cliente está DESLIGADA.
