# Owner overlay for the paste filter (ADR-0011). Appended after global/clipboard.conf. It carries NO
# terms: the term list lives only in the untracked local overlay outside this repository.
#
# He converses in Portuguese, so the notices he sees are in Portuguese. The category names inside
# {categories} stay in English. These are the agent's wording, not his.
notice_blocked=Filtro de colagem (ADR-0011): {categories} neste prompt. Ele NÃO foi enviado e nada foi alterado. Abaixo vai uma cópia redigida: envie essa, ou edite o seu prompt.
notice_cleaned_too_long=A cópia redigida tem {chars} caracteres, longa demais para mostrar aqui.
notice_too_large=Filtro de colagem (ADR-0011): este prompt tem mais de {max} bytes e NÃO foi verificado.
notice_error=Filtro de colagem (ADR-0011): erro interno ({error}); este prompt NÃO foi verificado.
notice_no_salt=Filtro de colagem (ADR-0011): a lista de termos existe mas o sal não pôde ser lido sem um pedido de senha (Keychain bloqueado, lento ou item ausente), então termos de empregador e cliente NÃO foram verificados neste prompt.
# The paste wrapper (automatic cleaning at the paste boundary). The first two replace a paste inside the
# CLI's input, so they stay on one line.
notice_paste_too_large=[filtro de colagem (ADR-0011): uma colagem de mais de {max} bytes NÃO foi repassada, não pôde ser verificada]
notice_paste_error=[filtro de colagem (ADR-0011): erro interno ({error}), a colagem NÃO foi repassada]
notice_no_bracketed_paste=Filtro de colagem (ADR-0011): {program} não ativou o bracketed paste, então as colagens desta sessão NÃO são limpas.
notice_session_summary=Filtro de colagem (ADR-0011): {count} colagem(ns) limpa(s) nesta sessão ({categories}); {replaced} colagem(ns) trocada(s) por um aviso.
notice_wrapper_no_salt=Filtro de colagem (ADR-0011): a lista de termos existe mas o sal não pôde ser lido sem um pedido de senha, então termos de empregador e cliente NÃO são limpos nesta sessão.
notice_paste_redacted=Filtro de colagem (ADR-0011): este prompt contém texto redigido ({categories}); o original não foi enviado.
