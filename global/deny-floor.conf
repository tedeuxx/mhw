# The firewall's generic deny floor (ADR-0016). install.sh renders it at user level;
# install-managed.sh renders the same entries into the admin layer, where no session flag drops it
# (ADR-0016, 2026-10-05 amendment). One entry per line:
#
#   cmd  <word> <word> ...   a command PREFIX, matched word by word from the program name.
#                            Claude Code: "Bash(<words>:*)" in permissions.deny.
#                            Codex: prefix_rule(pattern=[<words>], decision="forbidden").
#   file <path>              a credential file no agent may read or write.
#                            Claude Code: "Read(<path>)" and "Edit(<path>)". Codex: nothing (it has no
#                            file rule); the gap is stated in ADR-0016.
#   glob <word> ... <word>*  Claude Code ONLY: "Bash(<words>)", a wildcard match. For a form a prefix
#                            cannot reach because the variable part is inside a word ("-chdir=DIR").
#                            Codex: nothing (a prefix_rule token is exact); the gap is stated beside
#                            each glob entry.
#
# A word holds letters, digits and . _ / ~ = : @ + - only (no quote, space, backslash or parenthesis).
# "*" is allowed in a file path, never in a cmd word, and in a glob entry only as the last character
# of the last word, because Claude reads it as a wildcard and Codex as a literal character, so the two
# harnesses would disagree about the same cmd entry.
#
# Generic: no owner path, account or repository. Owner extras go in overlay/deny-floor.conf, which is
# appended. What a prefix cannot catch (another spelling, a wrapper, a flag in another position, a
# script) is listed in ADR-0016, "What a deny cannot do".

# --- Bypassing the permission layer itself -------------------------------------------------------
cmd claude --dangerously-skip-permissions
cmd claude --allow-dangerously-skip-permissions
cmd claude --permission-mode bypassPermissions
cmd codex --dangerously-bypass-approvals-and-sandbox
cmd codex exec --dangerously-bypass-approvals-and-sandbox
cmd codex --dangerously-bypass-hook-trust
cmd codex exec --dangerously-bypass-hook-trust
cmd codex --sandbox danger-full-access
cmd codex -s danger-full-access
cmd codex exec --sandbox danger-full-access
cmd codex exec -s danger-full-access
cmd sudo

# --- Reading a credential into an agent's context ------------------------------------------------
cmd gh auth token
cmd security find-generic-password
cmd security find-internet-password
cmd security dump-keychain
cmd aws configure export-credentials
cmd aws configure get aws_secret_access_key
cmd aws secretsmanager get-secret-value
# A decrypted SSM SecureString (owner, 2026-10-10). The flag sits mid-command, so a prefix catches it
# only where it directly follows the subcommand, as listed. NOT caught, and these are the common forms:
# the flag after another option ("aws ssm get-parameter --name /x --with-decryption"), a global option
# before "ssm" ("aws --profile p ssm ..."), and "--cli-input-json" carrying WithDecryption.
cmd aws ssm get-parameter --with-decryption
cmd aws ssm get-parameters --with-decryption
cmd aws ssm get-parameters-by-path --with-decryption
cmd aws ssm get-parameter-history --with-decryption
# Interactive login (owner, 2026-10-10): it mints a session for the agent's own use. "aws --profile p
# sso login" (a global option before the service) is not caught.
cmd aws sso login
file ~/.ssh/id_*
file ~/.aws/credentials
file ~/.netrc
file ~/.config/gh/hosts.yml
file ~/.docker/config.json
file ~/.codex/auth.json
file ~/.claude/.credentials.json
# Project secrets (owner, 2026-10-10). A path with no "/", "//" or "~/" in front is relative to the
# session's working directory in Claude Code: measured on 2.1.296, "Read(**/.env)" denied the Read tool
# on <cwd>/sub/.env and also "cat sub/.env" through Bash, while a .env OUTSIDE the working directory was
# not denied (it fell through to the ordinary outside-the-workspace permission prompt). "**/.env.*" also
# denies a committed template such as .env.example. Codex: NOT denied anywhere; it has no file rule, and
# inside its workspace sandbox the agent reads any file.
file **/.env
file **/.env.*
file **/*.pem
file **/credentials*

