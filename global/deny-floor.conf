# The firewall's generic deny floor (ADR-0016). install.sh renders it at user level;
# install-managed.sh renders the same entries into the admin layer, where no session flag drops it
# (ADR-0016, 2026-10-05 amendment). One entry per line:
#
#   cmd  <word> <word> ...   a command PREFIX, matched word by word from the program name.
#                            Claude Code: "Bash(<words>:*)" in permissions.deny.
#                            Codex: prefix_rule(pattern=[<words>], decision="forbidden").
#   file <path>              a credential file no agent may read or write.
#                            Claude Code: "Read(<path>)" and "Edit(<path>)". Codex: nothing (it has no
#                            file rule); the gap is stated in ADR-0016.
#
# A word holds letters, digits and . _ / ~ = : @ + - only (no quote, space, backslash or parenthesis).
# "*" is allowed in a file path and never in a cmd word, because Claude reads it as a wildcard and
# Codex as a literal character, so the two harnesses would disagree about the same entry.
#
# Generic: no owner path, account or repository. Owner extras go in overlay/deny-floor.conf, which is
# appended. What a prefix cannot catch (another spelling, a wrapper, a flag in another position, a
# script) is listed in ADR-0016, "What a deny cannot do".

# --- Bypassing the permission layer itself -------------------------------------------------------
cmd claude --dangerously-skip-permissions
cmd claude --allow-dangerously-skip-permissions
cmd claude --permission-mode bypassPermissions
cmd codex --dangerously-bypass-approvals-and-sandbox
cmd codex exec --dangerously-bypass-approvals-and-sandbox
cmd codex --dangerously-bypass-hook-trust
cmd codex exec --dangerously-bypass-hook-trust
cmd codex --sandbox danger-full-access
cmd codex -s danger-full-access
cmd codex exec --sandbox danger-full-access
cmd codex exec -s danger-full-access
cmd sudo

# --- Reading a credential into an agent's context ------------------------------------------------
cmd gh auth token
cmd security find-generic-password
cmd security find-internet-password
cmd security dump-keychain
cmd aws configure export-credentials
cmd aws configure get aws_secret_access_key
cmd aws secretsmanager get-secret-value
file ~/.ssh/id_*
file ~/.aws/credentials
file ~/.netrc
file ~/.config/gh/hosts.yml
file ~/.docker/config.json
file ~/.codex/auth.json
file ~/.claude/.credentials.json

# --- Writing or deleting a secret or credential --------------------------------------------------
cmd gh secret set
cmd gh secret delete
cmd gh secret remove
cmd aws secretsmanager create-secret
cmd aws secretsmanager put-secret-value
cmd aws secretsmanager update-secret
cmd aws secretsmanager delete-secret
cmd aws secretsmanager restore-secret
cmd aws ssm put-parameter
cmd aws iam create-access-key
cmd security add-generic-password
cmd security add-internet-password
cmd security delete-generic-password
cmd security delete-internet-password

# --- Rewriting history, or destroying what makes it recoverable ----------------------------------
cmd git push --force
cmd git push --force-with-lease
cmd git push --force-if-includes
cmd git push -f
cmd git push --mirror
cmd git reset --hard
cmd git filter-branch
cmd git filter-repo
cmd git reflog expire
cmd git reflog delete
cmd git gc --prune=now

# --- Destructive deletes (the flag spellings are a set; each is its own entry) -------------------
cmd rm -rf
cmd rm -fr
cmd rm -Rf
cmd rm -fR
cmd rm -r -f
cmd rm -f -r
cmd rm -R -f
cmd rm -f -R
cmd rm --recursive --force
cmd rm --force --recursive
cmd git clean -f
cmd git clean -fd
cmd git clean -df
cmd git clean -fx
cmd git clean -xf
cmd git clean -fdx
cmd git clean -fxd
cmd git clean -dfx
cmd git clean -dxf
cmd git clean -xdf
cmd git clean -xfd
cmd git clean --force
cmd git clean -d -f
cmd git clean -x -f
# Removing a worktree with force deletes its uncommitted work (ADR-0016, 2026-10-05 amendment). A
# clean worktree needs no force, so this denies only the forced removal.
cmd git worktree remove --force
cmd git worktree remove -f

# --- Mutating infrastructure state outside a pipeline --------------------------------------------
cmd terraform apply
cmd terraform destroy
# A dispatched workflow can reach the pipeline's credentials without the review a merge carries.
cmd gh workflow run

# --- Writing through the raw API (the method flag must come before the endpoint) -----------------
cmd gh api -X POST
cmd gh api -X PUT
cmd gh api -X PATCH
cmd gh api -X DELETE
cmd gh api --method POST
cmd gh api --method PUT
cmd gh api --method PATCH
cmd gh api --method DELETE

# --- Publishing, releasing, and deleting or exposing a repository --------------------------------
cmd gh repo delete
cmd gh repo archive
cmd gh repo rename
cmd gh repo edit --visibility
cmd gh release create
cmd gh release delete
cmd gh release edit
cmd gh release upload
cmd gh gist create
cmd npm publish
cmd npm unpublish
cmd pnpm publish
cmd yarn publish
cmd yarn npm publish
cmd cargo publish
cmd twine upload
cmd gem push
cmd docker push
