cmd security delete-generic-password
cmd security delete-internet-password

# --- Rewriting history, or destroying what makes it recoverable ----------------------------------
cmd git push --force
cmd git push --force-with-lease
cmd git push --force-if-includes
cmd git push -f
cmd git push --mirror
cmd git reset --hard
cmd git filter-branch
cmd git filter-repo
cmd git reflog expire
cmd git reflog delete
cmd git gc --prune=now
# Skipping the repository's own hooks (owner, 2026-10-10). "-n" is git commit's short spelling of
# "--no-verify" (git push has no short one). The flag sits mid-command, so only the forms listed here
# are caught. NOT caught, and the most common one is first: a message before the flag
# ("git commit -m msg --no-verify"), combined short flags ("git commit -anm msg"), a refspec before the
# flag ("git push origin topic --no-verify"), "git -C <dir> commit|push --no-verify", and
# core.hooksPath pointed elsewhere.
cmd git commit --no-verify
cmd git commit -n
cmd git commit -a --no-verify
cmd git commit -a -n
cmd git commit --all --no-verify
cmd git commit --amend --no-verify
cmd git commit --amend -n
cmd git push --no-verify
cmd git push origin --no-verify
cmd git push -u --no-verify
cmd git push --set-upstream --no-verify
# Never squash (owner, 2026-10-05: a workstation standard). A squash merge discards the per-commit
# history of the merged branch. Prefix only: "gh pr merge 12 --squash" (flag after the number) is not
# caught here; the repository setting (global/github-repo-settings.json) refuses it on the forge.
cmd gh pr merge --squash
cmd gh pr merge -s

# --- Destructive deletes (the flag spellings are a set; each is its own entry) -------------------
cmd rm -rf
cmd rm -fr
cmd rm -Rf
cmd rm -fR
cmd rm -r -f
cmd rm -f -r
cmd rm -R -f
cmd rm -f -R
cmd rm --recursive --force
cmd rm --force --recursive
cmd git clean -f
cmd git clean -fd
cmd git clean -df
cmd git clean -fx
cmd git clean -xf
cmd git clean -fdx
cmd git clean -fxd
cmd git clean -dfx
cmd git clean -dxf
cmd git clean -xdf
cmd git clean -xfd
cmd git clean --force
cmd git clean -d -f
cmd git clean -x -f
# Removing a worktree with force deletes its uncommitted work (ADR-0016, 2026-10-05 amendment). A
# clean worktree needs no force, so this denies only the forced removal.
cmd git worktree remove --force
cmd git worktree remove -f

# --- Mutating infrastructure state outside a pipeline --------------------------------------------
# Terraform and OpenTofu (owner, 2026-10-10, ADR-0035): only "fmt", "validate" and "version" stay open;
# every other subcommand reads remote state, prints its secrets, or changes it. The list is the
# subcommand set "terraform -help" printed on 1.12.1 (measured 2026-10-10); a subcommand a later release
# adds is not covered until it is listed here.
# Declared gap, by the owner's choice: EVERY "init" is denied, "init -backend=false" included. A prefix
# floor reads the words from the program name on, so it cannot tell "init -backend=false" (local only)
# from "init" (contacts the backend); allowing the first would allow both.
# Not caught: a global option before the subcommand other than -chdir ("terraform -help plan"), a
# TF_CLI_ARGS or TF_CLI_ARGS_<sub> variable, a wrapper (terragrunt, make, a script) and a binary renamed
# or called by another path.
cmd terraform init
cmd terraform plan
cmd terraform apply
cmd terraform destroy
cmd terraform console
cmd terraform force-unlock
cmd terraform get
cmd terraform graph
cmd terraform import
cmd terraform login
cmd terraform logout
cmd terraform metadata
cmd terraform modules
cmd terraform output
cmd terraform providers
cmd terraform refresh
cmd terraform show
cmd terraform state
cmd terraform taint
cmd terraform test
cmd terraform untaint
cmd terraform workspace
cmd tofu init
cmd tofu plan
cmd tofu apply
cmd tofu destroy
cmd tofu console
cmd tofu force-unlock
cmd tofu get
cmd tofu graph
cmd tofu import
cmd tofu login
cmd tofu logout
cmd tofu metadata
cmd tofu modules
cmd tofu output
cmd tofu providers
cmd tofu refresh
cmd tofu show
cmd tofu state
cmd tofu taint
cmd tofu test
cmd tofu untaint
cmd tofu workspace
# "-chdir" exists only as one word, "-chdir=DIR" ("terraform -chdir version" is refused by terraform
# itself, measured on 1.12.1), so a cmd prefix "terraform -chdir" matches nothing: measured on Claude
# Code 2.1.296, "Bash(terraform -chdir:*)" let "terraform -chdir=. version" run. Hence a glob entry,
# which Claude Code reads as a wildcard ("Bash(terraform -chdir=*)" denied the same command, same
# build). It denies every -chdir form, fmt and validate included. Codex has no wildcard: "-chdir=DIR"
# is NOT denied on Codex (a prefix_rule token is exact, and the directory varies).
glob terraform -chdir=*
glob tofu -chdir=*
# A dispatched workflow can reach the pipeline's credentials without the review a merge carries.
cmd gh workflow run

