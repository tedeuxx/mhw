# User-level Claude Code deny entries the policy retired. install.sh (settings_retire in allow-list.sh)
# and install.ps1 remove each from permissions.deny in ~/.claude/settings.json on every run, with a
# backup (settings.json.pmhwc-deny-backup), and report it old -> new (Issue #242, the #145 pattern of
# allow-retired.conf). One exact rule per line, as Claude Code stores it. Nothing else is removed: a
# rule the owner wrote that is not listed here stays, and a rule the deny floor renders (deny-floor.conf
# and the overlay's) is never removed even if it is listed here. Uninstall does not re-add a retired
# rule; the backup is the restore route.
#
# Owner ruling, 2026-11-01 (https://github.com/tedeuxx/mhw/issues/242): remove the broad "gh api" deny,
# an owner-authored rule that blocked every gh api call, reads included (the milestone read route among
# them). The floor's gh api WRITE-method prefixes (gh api -X POST|PUT|PATCH|DELETE and the --method
# spellings) stay, so a write that spells its method remains denied by prefix. A write that names no
# method is NOT: gh api switches to POST when -f, -F or --input is passed (as Issue #242 records it), and
# no prefix tells that from a read. Removing this rule is a permission widening the owner decided, that
# gap included; it is not this file's to extend. The three spellings are the
# same rule written the ways Claude Code accepts a wildcard (https://code.claude.com/docs/en/permissions):
# "Bash(x:*)", "Bash(x *)" and "Bash(x*)".
Bash(gh api:*)
Bash(gh api *)
Bash(gh api*)
