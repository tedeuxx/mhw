# User-level Claude Code allow entries the policy retired. install.sh (allow_retire in allow-list.sh)
# removes each from permissions.allow in ~/.claude/settings.json on every run, with a backup, and reports
# it old -> new (Issue #145). One exact rule per line, as Claude Code stores it. Nothing else is removed:
# a rule the owner wrote that is not listed here stays.
#
# ADR-0035 decision 4: find (-delete, -exec) and awk (system()) can delete or execute, and a prefix floor
# cannot block only those forms, so the whole command asks. Owner: "voce conseguiria somente tirar essas
# brechas extremas que mencionou no 3?". "Everything else stays": this list holds those two programs and
# no other, each in the ":*" spelling and the space-wildcard spelling of a whole-program allow.
Bash(find:*)
Bash(awk:*)
Bash(find *)
Bash(awk *)
