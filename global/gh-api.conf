# The baseline's gh api rule set (Issue #593, ADR-0048). The owner's decisions of 2026-11-23 on #593:
# "Abrir o deny" (the floor's gh api write entries leave deny-floor.conf, and the milestones endpoint is
# allowed) and "Mover para o baseline" (mhw manages the gh api rules itself and retires his hand-kept
# "Bash(gh api:*)" deny). His rule set: gh api reads pass; writes are denied except the milestones endpoint.
#
# mhw install-user renders it through the allow-list step (src/render/allow-list.js, src/render/gh-api.js),
# at USER level, in every tier, for Claude Code, Codex and Kiro. Every kind and every value is a closed set
# in src/render/gh-api.js; anything else is refused before anything is written. One entry per line:
#
#   deny-method <M>         M is POST, PUT, PATCH or DELETE. Denies "gh api -X M", "gh api -XM",
#                           "gh api --method M" and "gh api --method=M" as a prefix: Claude Code
#                           permissions.deny, Codex decision="forbidden". Kiro: none (asked).
#   allow-endpoint <E>      E is "milestones". Allows repos/<owner>/<repo>/<E>[/<number>], spelled endpoint
#                           first: Claude Code "Bash(gh api repos/*/<E>*)" in permissions.allow, Kiro an
#                           allowedCommands pattern and V3 match patterns. Codex: none (a token is exact).
#   retire-deny <R>         R is "Bash(gh api:*)". Install removes it from ~/.claude/settings.json
#                           permissions.deny, keeping the file as settings.json.pmhwc-gh-api-backup (never
#                           overwritten); uninstall restores it.
#
# A prefix rule cannot separate every spelling: a write spelled endpoint first to another endpoint is asked,
# not denied, and the Claude Code allow's wildcard also admits a write whose text carries "/milestones".
# ADR-0048 lists every residual, and test/render/gh-api.test.js names each one.

deny-method POST
deny-method PUT
deny-method PATCH
deny-method DELETE
allow-endpoint milestones
retire-deny Bash(gh api:*)
