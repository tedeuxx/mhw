# The workstation's pre-authorisation for the inner loop (Issue #83, ADR-0031). install.sh renders it
# at USER level, natively per agent harness; the deny floor (deny-floor.conf) is the barrier and deny
# always beats allow. The narrow tier is read-only. The wide tier is the full inner loop, by the owner's
# decision of 2026-10-05 on #83: it exists only behind the root-owned admin deny floor. One entry per line:
#
#   <tier> <kind> <word> <word> ...
#
#   tier   narrow   always rendered: reading and inspecting, nothing that writes or publishes.
#          wide     rendered for a harness only while the ADMIN deny floor is complete for it
#                   (install-managed.sh). Without that barrier the installer renders narrow and says so.
#   kind   cmd      a command PREFIX, matched word by word from the program name.
#                   Claude Code: "Bash(<words>:*)" in permissions.allow.
#                   Codex: prefix_rule(pattern=[<words>], decision="allow"). Codex loads it in every
#                   session, with or without --profile (measured, ADR-0031).
#                   Kiro: an anchored allowedCommands pattern (narrow tier only; Kiro has no floor).
#          runner   ONE repository test script, wide tier only, Claude Code only: sh, bash or python3,
#                   no option but -B or -I, then one relative .sh or .py path. The owner's own suites
#                   are in overlay/allow-list.conf. It runs repository code without a prompt (ADR-0031).
#          deny     an escaping option, denied as a prefix wherever its command is allowed:
#                   Claude Code "Bash(<words>:*)" in permissions.deny, Codex decision="forbidden".
#
# Words follow deny-floor.conf: letters, digits and . _ ~ = : @ + - only, never "*" or "/" (a runner's
# script path is the one exception). The installer refuses an entry that is a word prefix of a floor
# entry, one that a floor entry covers, a cmd whose program is a shell, an interpreter, a dispatcher or a
# project-code runner, the routes that publish or write anywhere, the read and build routes in the narrow
# tier, and an unpinned "git add" or "git commit".
#
# A deny is a PREFIX: it catches the escaping option only right after the command words, in the spaced
# form. "git diff --stat --no-index a b", "git diff --output=<path>" and "git fetch --upload-pack=<prog>"
# are not caught; ADR-0031 lists them, measured.
#
# Never pre-authorised (ADR-0031): git push, git worktree add, gh issue/pr comment and create, gh api,
# ./workstation (every subcommand), a bare interpreter, and Edit/Write/Read as tool-wide allows.

# --- narrow: read and inspect ----------------------------------------------------------------------
narrow cmd git status
narrow cmd git rev-parse
narrow cmd git describe
narrow cmd git worktree list
narrow cmd gh issue view
narrow cmd gh issue list
narrow cmd gh pr view
narrow cmd gh pr list
narrow cmd gh pr diff
narrow cmd gh pr checks

# --- wide: the full inner loop on a feature branch, behind the admin floor --------------------------
wide cmd git diff
wide cmd git log
wide cmd git show
wide cmd git grep
wide cmd git blame
wide cmd git ls-files
wide cmd git branch
wide cmd git fetch
wide cmd git switch -c
wide cmd git switch --create
# "--" ends option parsing, so no --pathspec-from-file can follow (measured, git 2.54.0).
wide cmd git add --
# git refuses -F/--file beside -m, and ignores -t/--template (measured). --pathspec-from-file is not
# refused by git and is a residual (ADR-0031).
wide cmd git commit -m

# --- wide: the escaping options, denied where the command is allowed ---------------------------------
wide deny git diff --no-index
wide deny git diff --output
wide deny git log --output
wide deny git show --output
wide deny git grep --no-index
wide deny git grep -O
wide deny git grep --open-files-in-pager
wide deny git blame --contents
wide deny git ls-files --exclude-from
wide deny git fetch --upload-pack
