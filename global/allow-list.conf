# The workstation's pre-authorisation for the inner loop (Issue #83, ADR-0031). install.sh renders it
# at USER level, natively per agent harness; the deny floor (deny-floor.conf) is the barrier and deny
# always beats allow. One entry per line:
#
#   <tier> <kind> <word> <word> ...
#
#   tier   narrow   always rendered: reading and inspecting, nothing that writes or publishes.
#          wide     rendered for a harness only while the ADMIN deny floor is complete for it
#                   (install-managed.sh). Without that barrier the installer renders narrow and says so.
#   kind   cmd      a command PREFIX, matched word by word from the program name.
#                   Claude Code: "Bash(<words>:*)" in permissions.allow.
#                   Codex: prefix_rule(pattern=[<words>], decision="allow").
#                   Kiro: an anchored allowedCommands pattern (narrow tier only; Kiro has no floor).
#          runner   a test runner: Claude Code only. Codex runs it inside its workspace-write sandbox
#                   without a rule, and an allow rule there would also let it escalate out of the sandbox.
#
# Words follow deny-floor.conf: letters, digits and . _ / ~ = : @ + - only, never "*". The installer
# refuses an entry that is a word prefix of a floor entry (it would cover a family the floor only
# partly denies, such as "git push") and one that a floor entry already covers (it could never apply).
#
# Deliberately NOT here, each a gap stated in ADR-0031:
#   git push         the floor denies only some spellings of pushing to the trunk or tags
#                    ("git push -u origin main" and "git push origin main:main" match no floor entry),
#                    so an allow would let the others through without a prompt.
#   git checkout, git switch (plain), git restore, git stash, git rebase
#                    each can discard uncommitted work; "git switch -c" cannot.
#   gh pr create, gh pr merge, gh api
#                    opening and merging are the gate's acts; the raw API is a write route.
#   Edit, Write, Read as tools
#                    a tool-wide allow reaches every path, ~/.claude/settings.json included. Edits in
#                    the working directory come from the recommended permission mode instead.
#   ./workstation update, ./workstation uninstall
#                    they change which release, or whether any protection, is installed.

# --- narrow: read and inspect ----------------------------------------------------------------------
narrow cmd git status
narrow cmd git diff
narrow cmd git log
narrow cmd git show
narrow cmd git rev-parse
narrow cmd git ls-files
narrow cmd git grep
narrow cmd git blame
narrow cmd git describe
narrow cmd git branch --show-current
narrow cmd git branch --list
narrow cmd git worktree list
narrow cmd gh issue view
narrow cmd gh issue list
narrow cmd gh pr view
narrow cmd gh pr list
narrow cmd gh pr diff
narrow cmd gh pr checks
narrow cmd ./workstation status
narrow cmd ./workstation check

# --- wide: build on a feature branch, run the tests, report on the tracker --------------------------
wide cmd git add
wide cmd git commit
wide cmd git switch -c
wide cmd git switch --create
wide cmd git fetch
wide cmd git worktree add
wide cmd gh issue comment
wide cmd gh pr comment
wide cmd ./workstation install
wide runner npm test
wide runner npm run test
wide runner pytest
wide runner python3 -m pytest
wide runner python3 -m unittest
wide runner go test
wide runner cargo test
wide runner make test
