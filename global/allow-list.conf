# The workstation's pre-authorisation for the inner loop (Issue #83, ADR-0031). install.sh renders it
# at USER level, natively per agent harness; the deny floor (deny-floor.conf) is the barrier and deny
# always beats allow. Least privilege: an entry stays only when none of its options reads or writes an
# arbitrary path or runs a program. One entry per line:
#
#   <tier> <kind> <word> <word> ...
#
#   tier   narrow   always rendered: reading and inspecting, nothing that writes or publishes.
#          wide     rendered for a harness only while the ADMIN deny floor is complete for it
#                   (install-managed.sh). Without that barrier the installer renders narrow and says so.
#   kind   cmd      a command PREFIX, matched word by word from the program name.
#                   Claude Code: "Bash(<words>:*)" in permissions.allow.
#                   Codex: prefix_rule(pattern=[<words>], decision="allow"). Codex loads it in every
#                   session, with or without --profile (measured, ADR-0031).
#                   Kiro: an anchored allowedCommands pattern (narrow tier only; Kiro has no floor).
#          runner   Claude Code only. No entry today: a test runner executes project code that an
#                   agent with acceptEdits can rewrite, so it would pre-authorise anything.
#
# Words follow deny-floor.conf: letters, digits and . _ ~ = : @ + - only, never "*" or "/". The installer
# refuses an entry that is a word prefix of a floor entry, one that a floor entry already covers, and
# one whose program is a shell, an interpreter or a dispatcher (bash, sh, python3, node, env, xargs, ...)
# or a path (./workstation): each would let an agent grant itself anything.
#
# Dropped, with the reason (ADR-0031, "What the list leaves out"):
#   git diff, git log, git show   --output=<path> writes anywhere; diff --no-index reads anywhere
#   git grep                      -O<program> runs a program; --no-index reads anywhere
#   git blame                     --contents <path> prints any file
#   git ls-files                  --exclude-from=<path> reads any file
#   git branch                    a pinned flag still takes trailing options (-D, -m)
#   git fetch                     --upload-pack=<program> runs a program
#   git add                       --pathspec-from-file=<path> reads any file, echoed in errors
#   git commit                    -F/--file, -t/--template read any file into the message
#   git worktree add              the path argument creates a checkout anywhere
#   gh issue comment, gh pr comment  --body-file <path> reads any file and publishes it
#   ./workstation (every subcommand) a relative path, and install renders this very list
#   test runners (npm, pytest, python3 -m, go, cargo, make)  run project code an agent can edit
#   git push                      a prefix floor sees only the trunk spellings it lists
#   git checkout, git switch (plain), git restore, git stash, git rebase  can discard work
#   gh pr create, gh pr merge, gh api  the gate's acts, and a raw write route
#   Edit, Write, Read as tools    a tool-wide allow reaches every path

# --- narrow: read and inspect ----------------------------------------------------------------------
narrow cmd git status
narrow cmd git rev-parse
narrow cmd git describe
narrow cmd git worktree list
narrow cmd gh issue view
narrow cmd gh issue list
narrow cmd gh pr view
narrow cmd gh pr list
narrow cmd gh pr diff
narrow cmd gh pr checks

# --- wide: start a feature branch (edits come from acceptEdits, inside the working directory) -------
wide cmd git switch -c
wide cmd git switch --create
