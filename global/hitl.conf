# Generic escalation limits for global/hooks/hitl-escalation-guard.sh (ADR-0013).
# An owner overlay (overlay/hitl.conf) is appended after this file; the last value of a key wins.
# Format: key=value, one per line; spaces around keys and numbers are ignored; '#' starts a comment.
# For each limit, 0 means the check is OFF.
#
# max_questions: questions one structured picker may carry. 1 = one ask per activation.
#   Generic, not owner-specific: a second question is lost on some surfaces without a report.
max_questions=1
#
# max_question_chars: characters in one question stem.
#   Off by default: how short an interruption must be is a personal preference, set in an overlay.
max_question_chars=0
# exact_options: 3 = exactly three authored choices, single-select; 0 = native defaults.
# Personal preference (ADR-0019), enabled only by an owner's overlay.
exact_options=0
#
# intake_exception: Header|Label|Label, the one picker shape exempt from exact_options in any working
#   directory: the ADR-0021 workspace session intake the global brief names. Empty = no exception.
intake_exception=Session type|Melhoria de harness|Bugfix
#
# notice_count / notice_length: the notice shown to the owner on a refusal, in his language.
#   Placeholders: {count} {chars} {max}. Category and mitigation only, never the question text.
#   Unset here: the hook's built-in English text applies unless an overlay sets them.
