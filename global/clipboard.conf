# Clipboard guard defaults (ADR-0011). The overlay's clipboard.conf is appended after this file; the
# last value of a key wins. Format: key=value, '#' starts a comment; an invalid value falls back to the
# built-in default, and an invalid mode falls back to offer.
#
# mode=offer     on a finding, show a dialog (Clean / Clear / Keep). Nothing changes unless the owner
#                picks Clean or Clear; a timeout or dismissal keeps the item as copied. DEFAULT: it is
#                the reversible choice, and ADR-0011's mechanism is still proposed.
# mode=sanitise  replace the item with a redacted plain-text copy at once, then notify. Not reversible:
#                no copy of the original is kept anywhere (ADR-0005).
mode=offer
poll_seconds=1
# Items larger than this are NOT checked, and the owner is told so. Measured 2026-10-01 on the stock
# python3 3.9.6 (Apple Silicon): about 3.2 s to scan 1,000,000 bytes.
max_bytes=1000000
dialog_seconds=120
# The salt store: keychain (macOS default) or file (a user-only file in the local overlay directory).
# salt_store=keychain
# The term list's default path is <data dir>/local-overlay/clipboard-terms, outside every repository.
# It is never part of this repository or of overlay/: it is written only by `clipboard_guard.py add-term`.
