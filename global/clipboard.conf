# Paste filter defaults (ADR-0011). The overlay's clipboard.conf is appended after this file; the last
# value of a key wins. Format: key=value, '#' starts a comment; an invalid value falls back to the
# built-in default. Keys of the retired clipboard watcher (mode, poll_seconds, dialog_seconds, button_*)
# are ignored.
#
# Which categories block a prompt submitted to Claude Code or Codex (the paste wrapper that also
# replaced them in a paste was removed by #590). Nine of the eleven by default: postal-address and contract-value are report-only
# (below), because on Portuguese work prose they fire on ticket numbers, streets in passing and prices
# (Issue #36). Removing one (for example email, if the owner's own address keeps tripping it) lets that
# category through; a name that is not one of the eleven makes the whole value invalid, and then these
# nine apply.
block_categories=employer-client-term,credential,email,payment-card,cpf,cnpj,phone,health,colleague-name
# Report-only (Issue #36): a category listed here and removed from block_categories is named in a
# notice and passes unchanged (the prompt hook). A name that is not a category makes the whole value invalid, and then
# this default applies again.
report_categories=postal-address,contract-value
# Prompts larger than this are NOT checked, and the owner is told so. Measured 2026-10-01 on the stock
# python3 3.9.6 (Apple Silicon): about 3.2 s to scan 1,000,000 bytes.
max_bytes=1000000
# The block message shows a redacted copy of the prompt up to this many characters (Claude Code caps a
# hook's message strings at 10,000 characters, documented).
show_cleaned_chars=8000
# No term list and no salt since #589: third-party terms (employer, client, colleague, health) are judged
# by the model, never matched against a list, so terms_file=, health_terms_file=, colleague_terms_file=,
# salt_file= and salt_store= are no longer read. A list or salt an earlier install left is moved aside by
# install (ADR-0047).
