# Paste filter defaults (ADR-0011). The overlay's clipboard.conf is appended after this file; the last
# value of a key wins. Format: key=value, '#' starts a comment; an invalid value falls back to the
# built-in default. Keys of the retired clipboard watcher (mode, poll_seconds, dialog_seconds, button_*)
# are ignored.
#
# Which categories block a prompt submitted to Claude Code or Codex, and which the paste wrapper
# replaces in a paste. All eleven by default (the last five since Issue #36). Removing one (for example
# email, if the owner's own address keeps tripping it) lets that category through; a name that is not
# one of the eleven makes the whole value invalid, and then all eleven apply.
block_categories=employer-client-term,credential,email,payment-card,cpf,cnpj,phone,postal-address,contract-value,health,colleague-name
# Report-only (Issue #36): a category listed here and removed from block_categories is named in a
# notice and passes unchanged (the prompt hook), or is forwarded unchanged and counted in the session
# summary (the paste wrapper). Empty by default. A name that is not a category empties the value.
report_categories=
# Prompts larger than this are NOT checked, and the owner is told so. Measured 2026-10-01 on the stock
# python3 3.9.6 (Apple Silicon): about 3.2 s to scan 1,000,000 bytes.
max_bytes=1000000
# The block message shows a redacted copy of the prompt up to this many characters (Claude Code caps a
# hook's message strings at 10,000 characters, documented).
show_cleaned_chars=8000
# The salt store: keychain (macOS default) or file (a user-only file in the local overlay directory).
# salt_store=keychain
# The term list's default path is <data dir>/local-overlay/clipboard-terms, outside every repository.
# It is never part of this repository or of overlay/: it is written only by `clipboard_guard.py add-term`.
# The health and colleague-name lists (Issue #36) sit beside it, clipboard-terms-health and
# clipboard-terms-colleague, written only by `clipboard_guard.py add-term --list health|colleague-name`.
