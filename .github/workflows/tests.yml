# Run the installer and hook suites, and shellcheck, on every PR into main or into the rc/next
# integration branch that slice PRs target (ADR-0013).
# Every test writes only under $RUNNER_TEMP: throwaway HOMEs, never a real one.
name: tests

on:
  pull_request:
    branches: [main, rc/next]

permissions: {}

jobs:
  # Stable mechanical gate for the workspace's checked merge command.
  delivery-ci:
    if: always()
    needs: [shellcheck, profiles, suites, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner image)
        run: |
          shellcheck --version
          shellcheck -s sh workstation global/install.sh global/install.test.sh \
            global/allow-list.sh global/allow-list.test.sh global/mcp/mcp-launch.sh
      - name: python compile check, warnings as errors (the runner's python3; no third-party linter)
        run: |
          python3 --version
          python3 -W error -c 'import sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  compile(fh.read(), f, "exec")' \
            global/clipboard/clipboard_guard.py global/clipboard/clipboard_guard_test.py \
            global/clipboard/paste_wrapper.py global/clipboard/paste_wrapper_test.py \
            global/mcp/mcp_render.py global/mcp/mcp_render_test.py global/keychain_test_guard.py \
            global/profile/profile.py global/profile/profile_test.py \
            global/workstation.py global/workstation_test.py \
            global/method/method_render.py global/method/method_render_test.py \
            global/prerequisites.py global/prerequisites_test.py

  # Pure preference compilation: no harness installation, account calls or credential reads.
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: profile compiler suite and generated-source drift
        shell: bash
        run: |
          python -B global/profile/profile_test.py
          python -B global/profile/profile.py check --source overlay/profile.json --output overlay
          python -B workspace/delivery_test.py

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Evidence for Principle 1 (Issue #9): which POSIX sh runs the suites. On ubuntu /bin/sh is dash,
      # the strictest common POSIX sh; this step fails if that ever stops being true, so a green ubuntu
      # run is a dash run. On macOS /bin/sh is bash in POSIX mode.
      - name: which /bin/sh runs the suites
        run: |
          ls -l /bin/sh
          if [ "$RUNNER_OS" = Linux ]; then
            target=$(readlink -f /bin/sh)
            echo "/bin/sh -> $target"
            [ "$(basename "$target")" = dash ] || { echo "expected dash as /bin/sh on Linux"; exit 1; }
          fi
      - name: installer suite
        run: sh global/install.test.sh "$RUNNER_TEMP/install"
      # Issue #83, ADR-0031: the allow list, narrow without the admin floor and wide with it, in
      # throwaway HOMEs and a throwaway admin root. The codex execpolicy arm runs only where codex is found.
      - name: allow-list suite
        run: sh global/allow-list.test.sh "$RUNNER_TEMP/allow"
      - name: admin-layer installer suite (throwaway --root; never a system path, never root, ADR-0025)
        run: sh global/install-managed.test.sh "$RUNNER_TEMP/managed"
      # Issues #57 and #67: the version-key comparison and the status view, plus one end-to-end run of
      # ./workstation install and status in a throwaway HOME and admin root (TMPDIR under RUNNER_TEMP).
      - name: ./workstation suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/workstation_test.py
      # Issue #61, ADR-0032: the working method rendered into the three agent harnesses' user-level
      # carriers, in throwaway HOMEs only. Asserts every rendered agent keeps its tool list and every
      # rendered file its provenance stamp.
      - name: working-method renderer suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/method/method_render_test.py "$RUNNER_TEMP/method"
      # Issue #89: the prerequisites section of ./workstation check. Fake tool shims on a PATH holding
      # nothing else, a stub gh, a loopback server for SonarCloud and HCP Terraform; no network, no account.
      - name: prerequisites suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/prerequisites_test.py
      - name: GitHub repository settings standard suite (stub gh on PATH; no network, never squash)
        run: sh global/github-repo-settings.test.sh "$RUNNER_TEMP/repo-settings"
      # ADR-0011, the paste filter. It never reads or writes the system clipboard. Issue #58: the real
      # `security` binary and Security.framework run ONLY here, on the ephemeral macOS runner, through
      # this explicit opt-in; everywhere else (any developer machine) the suite uses
      # global/security.test.stub and its guard refuses the real binary. Keychains are throwaway files
      # under $RUNNER_TEMP, under a throwaway HOME. The call log is printed as the probe.
      - name: paste filter suite
        env:
          PMHWC_REAL_KEYCHAIN_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          PMHWC_SECURITY_CALL_LOG: ${{ runner.temp }}/clipboard-security-calls.jsonl
        run: |
          python3 -B global/clipboard/clipboard_guard_test.py "$RUNNER_TEMP/clipboard"
          echo "security calls (probe):"; cat "$PMHWC_SECURITY_CALL_LOG" 2>/dev/null || echo "(none)"
      # ADR-0011, the paste wrapper: a real wrapper process between a pty the suite owns and a recorder
      # child. No real harness CLI, no shell rc, no terminal preferences, no clipboard.
      - name: paste wrapper suite
        run: python3 -B global/clipboard/paste_wrapper_test.py "$RUNNER_TEMP/paste-wrapper"
      # ADR-0017. Throwaway HOMEs only. Needs Python 3.11+ (tomllib) for the Codex surface. Issue #58:
      # the real `security` binary runs ONLY here, on the ephemeral macOS runner, through this explicit
      # opt-in; elsewhere the Keychain test uses global/security.test.stub. Keychains are throwaway
      # files under $RUNNER_TEMP, under a throwaway HOME. The call log is printed as the probe.
      - name: MCP renderer suite
        env:
          PMHWC_REAL_KEYCHAIN_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          PMHWC_SECURITY_CALL_LOG: ${{ runner.temp }}/mcp-security-calls.jsonl
        run: |
          python3 --version
          python3 -B global/mcp/mcp_render_test.py "$RUNNER_TEMP/mcp"
          echo "security calls (probe):"; cat "$PMHWC_SECURITY_CALL_LOG" 2>/dev/null || echo "(none)"

  # install.ps1 on a real Windows host (Issue #9, ADR-0010). Throwaway USERPROFILEs under RUNNER_TEMP
  # only. Runs under Windows PowerShell 5.1 (what a stock Windows has) and PowerShell 7. The runner's git
  # checks out with core.autocrlf=true, so this also exercises a CRLF source tree.
  windows:
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: installer suite (install.ps1 under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          git config --get core.autocrlf
          & $env:PS_EXE -NoProfile -Command '$PSVersionTable | Format-Table -AutoSize | Out-String'
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File global\install.test.ps1 "$env:RUNNER_TEMP\install-$env:PS_EXE"
          exit $LASTEXITCODE
