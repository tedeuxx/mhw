# Run the installer and hook suites, and shellcheck, on every PR into main (ADR-0013).
# Every test writes only under $RUNNER_TEMP: throwaway HOMEs, never a real one.
name: tests

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Stable mechanical gate for the workspace's checked merge command.
  delivery-ci:
    if: always()
    needs: [shellcheck, profiles, suites, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner image)
        run: |
          shellcheck --version
          shellcheck -s sh global/install.sh global/install.test.sh \
            global/hooks/hitl-escalation-guard.sh global/hooks/hitl-escalation-guard.test.sh \
            global/mcp/mcp-launch.sh
      - name: python compile check, warnings as errors (the runner's python3; no third-party linter)
        run: |
          python3 --version
          python3 -W error -c 'import sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  compile(fh.read(), f, "exec")' \
            global/clipboard/clipboard_guard.py global/clipboard/clipboard_guard_test.py \
            global/clipboard/paste_wrapper.py global/clipboard/paste_wrapper_test.py \
            global/mcp/mcp_render.py global/mcp/mcp_render_test.py \
            global/profile/profile.py global/profile/profile_test.py \
            global/hooks/restart_guard.py global/hooks/restart_guard_test.py \
            global/hooks/breaking_glass.py global/hooks/breaking_glass_test.py

  # Pure preference compilation: no harness installation, account calls or credential reads.
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: profile compiler suite and generated-source drift
        shell: bash
        run: |
          python -B global/profile/profile_test.py
          python -B global/profile/profile.py check --source overlay/profile.json --output overlay
          python -B workspace/delivery_test.py
          python -B global/hooks/restart_guard_test.py

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Evidence for Principle 1 (Issue #9): which POSIX sh runs the suites. On ubuntu /bin/sh is dash,
      # the strictest common POSIX sh; this step fails if that ever stops being true, so a green ubuntu
      # run is a dash run. On macOS /bin/sh is bash in POSIX mode.
      - name: which /bin/sh runs the suites
        run: |
          ls -l /bin/sh
          if [ "$RUNNER_OS" = Linux ]; then
            target=$(readlink -f /bin/sh)
            echo "/bin/sh -> $target"
            [ "$(basename "$target")" = dash ] || { echo "expected dash as /bin/sh on Linux"; exit 1; }
          fi
      - name: hook suite
        run: sh global/hooks/hitl-escalation-guard.test.sh "$RUNNER_TEMP/guard"
      - name: breaking-glass suite (POSIX ownership checks; Windows unsupported, ADR-0024)
        run: python3 -B global/hooks/breaking_glass_test.py
      - name: installer suite
        run: sh global/install.test.sh "$RUNNER_TEMP/install"
      # ADR-0011, the paste filter. It never reads or writes the system clipboard. On macOS, when the
      # runner's login Keychain is writable, it creates one namespaced item and deletes it.
      - name: paste filter suite
        run: python3 -B global/clipboard/clipboard_guard_test.py "$RUNNER_TEMP/clipboard"
      # ADR-0011, the paste wrapper: a real wrapper process between a pty the suite owns and a recorder
      # child. No real harness CLI, no shell rc, no terminal preferences, no clipboard.
      - name: paste wrapper suite
        run: python3 -B global/clipboard/paste_wrapper_test.py "$RUNNER_TEMP/paste-wrapper"
      # ADR-0017. Throwaway HOMEs only. Needs Python 3.11+ (tomllib) for the Codex surface. On macOS,
      # when the runner's login Keychain is writable, one namespaced synthetic item is created and deleted.
      - name: MCP renderer suite
        run: |
          python3 --version
          python3 -B global/mcp/mcp_render_test.py "$RUNNER_TEMP/mcp"

  # install.ps1 on a real Windows host (Issue #9, ADR-0010). Throwaway USERPROFILEs under RUNNER_TEMP
  # only. Runs under Windows PowerShell 5.1 (what a stock Windows has) and PowerShell 7. The runner's git
  # checks out with core.autocrlf=true, so this also exercises a CRLF source tree.
  windows:
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: installer suite (install.ps1 under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          git config --get core.autocrlf
          & $env:PS_EXE -NoProfile -Command '$PSVersionTable | Format-Table -AutoSize | Out-String'
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File global\install.test.ps1 "$env:RUNNER_TEMP\install-$env:PS_EXE"
          exit $LASTEXITCODE
