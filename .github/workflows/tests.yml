# Run the installer and hook suites, and shellcheck, on every PR into main or into the rc/next
# integration branch that slice PRs target (ADR-0013).
# Every test writes only under $RUNNER_TEMP: throwaway HOMEs, never a real one.
name: tests

on:
  pull_request:
    branches: [main, rc/next]

permissions: {}

jobs:
  # Stable mechanical gate for the workspace's checked merge command.
  delivery-ci:
    if: always()
    needs: [shellcheck, profiles, suites, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner image)
        run: |
          shellcheck --version
          shellcheck -s sh mhw workstation global/install.sh global/install.test.sh \
            global/allow-list.sh global/allow-list.test.sh global/mcp/mcp-launch.sh
      - name: python compile check, warnings as errors (the runner's python3; no third-party linter)
        run: |
          python3 --version
          python3 -W error -c 'import sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  compile(fh.read(), f, "exec")' \
            global/clipboard/clipboard_guard.py global/clipboard/clipboard_guard_test.py \
            global/clipboard/paste_wrapper.py global/clipboard/paste_wrapper_test.py \
            global/mcp/mcp_render.py global/mcp/mcp_render_test.py global/keychain_test_guard.py \
            global/profile/profile.py global/profile/profile_test.py \
            global/workstation.py global/workstation_test.py \
            global/scan.py global/scan_test.py \
            global/method/method_render.py global/method/method_render_test.py \
            global/method/method_commands_test.py \
            global/prerequisites.py global/prerequisites_test.py \
            global/npm_package_test.py
      - name: node syntax check of the npm launcher, alias and postinstall (Issue #68)
        run: |
          node --version
          node --check bin/mhw.js
          node --check bin/workstation.js
          node --check bin/postinstall.js

  # Pure preference compilation: no harness installation, account calls or credential reads.
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: profile compiler suite and generated-source drift
        shell: bash
        run: |
          python -B global/profile/profile_test.py
          python -B global/profile/profile.py check --source overlay/profile.json --output overlay
          python -B workspace/delivery_test.py

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Evidence for Principle 1 (Issue #9): which POSIX sh runs the suites. On ubuntu /bin/sh is dash,
      # the strictest common POSIX sh; this step fails if that ever stops being true, so a green ubuntu
      # run is a dash run. On macOS /bin/sh is bash in POSIX mode.
      - name: which /bin/sh runs the suites
        run: |
          ls -l /bin/sh
          if [ "$RUNNER_OS" = Linux ]; then
            target=$(readlink -f /bin/sh)
            echo "/bin/sh -> $target"
            [ "$(basename "$target")" = dash ] || { echo "expected dash as /bin/sh on Linux"; exit 1; }
          fi
      - name: installer suite
        run: sh global/install.test.sh "$RUNNER_TEMP/install"
      # Issue #83, ADR-0031: the allow list, narrow without the admin floor and wide with it, in
      # throwaway HOMEs and a throwaway admin root. The codex execpolicy arm runs only where codex is found.
      - name: allow-list suite
        run: sh global/allow-list.test.sh "$RUNNER_TEMP/allow"
      - name: admin-layer installer suite (throwaway --root; never a system path, never root, ADR-0025)
        run: sh global/install-managed.test.sh "$RUNNER_TEMP/managed"
      # Issues #57 and #67: the version-key comparison and the status view, plus one end-to-end run of
      # ./mhw install and status in a throwaway HOME and admin root (TMPDIR under RUNNER_TEMP).
      - name: ./mhw suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/workstation_test.py
      # ADR-0035 decision 7: mhw scan, the outbound scan, in throwaway git repositories and HOMEs, on
      # synthetic fixtures. Findings are reported by file:line, category and length, never the text.
      - name: outbound scan suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/scan_test.py
      # Issue #61, ADR-0032: the working method rendered into the three agent harnesses' user-level
      # carriers, in throwaway HOMEs only. Asserts every rendered agent keeps its tool list and every
      # rendered file its provenance stamp.
      - name: working-method renderer suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/method/method_render_test.py "$RUNNER_TEMP/method"
      # Issues #71-#75: the five workflow commands render on all three agent harnesses with their required
      # sections, Codex implicit invocation off; the handover sanitisation check on a synthetic fixture.
      - name: workflow-commands suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/method/method_commands_test.py "$RUNNER_TEMP/method-commands"
      # Issue #68, ADR-0034: the npm package. What GitHub serves (this tree, with .workstation-archive as
      # git archive fills it in) is npm-packed and installed with npm install -g into a throwaway prefix
      # and cache; its postinstall installs the user layer in a throwaway HOME and admin root, also through
      # npm's git-dependency preparation (git+file://), with --ignore-scripts and as a local dependency;
      # plus the launcher's Windows mapping with a stub PowerShell and the deprecated workstation alias.
      # The runner's preinstalled node and npm; nothing is fetched from or published to a registry.
      - name: npm package suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node --version; npm --version
          python3 -B global/npm_package_test.py
      # Issue #89: the prerequisites section of ./mhw check. Fake tool shims on a PATH holding
      # nothing else, a stub gh, a loopback server for SonarCloud and HCP Terraform; no network, no account.
      - name: prerequisites suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/prerequisites_test.py
      - name: GitHub repository settings standard suite (stub gh on PATH; no network, never squash)
        run: sh global/github-repo-settings.test.sh "$RUNNER_TEMP/repo-settings"
      # ADR-0011, the paste filter. It never reads or writes the system clipboard. Issue #58: the real
      # `security` binary and Security.framework run ONLY here, on the ephemeral macOS runner, through
      # this explicit opt-in; everywhere else (any developer machine) the suite uses
      # global/security.test.stub and its guard refuses the real binary. Keychains are throwaway files
      # under $RUNNER_TEMP, under a throwaway HOME. The call log is printed as the probe.
      - name: paste filter suite
        env:
          PMHWC_REAL_KEYCHAIN_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          PMHWC_SECURITY_CALL_LOG: ${{ runner.temp }}/clipboard-security-calls.jsonl
        run: |
          python3 -B global/clipboard/clipboard_guard_test.py "$RUNNER_TEMP/clipboard"
          echo "security calls (probe):"; cat "$PMHWC_SECURITY_CALL_LOG" 2>/dev/null || echo "(none)"
      # ADR-0011, the paste wrapper: a real wrapper process between a pty the suite owns and a recorder
      # child. No real harness CLI, no shell rc, no terminal preferences, no clipboard.
      - name: paste wrapper suite
        run: python3 -B global/clipboard/paste_wrapper_test.py "$RUNNER_TEMP/paste-wrapper"
      # ADR-0017. Throwaway HOMEs only. Needs Python 3.11+ (tomllib) for the Codex surface. Issue #58:
      # the real `security` binary runs ONLY here, on the ephemeral macOS runner, through this explicit
      # opt-in; elsewhere the Keychain test uses global/security.test.stub. Keychains are throwaway
      # files under $RUNNER_TEMP, under a throwaway HOME. The call log is printed as the probe.
      - name: MCP renderer suite
        env:
          PMHWC_REAL_KEYCHAIN_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
          PMHWC_SECURITY_CALL_LOG: ${{ runner.temp }}/mcp-security-calls.jsonl
        run: |
          python3 --version
          python3 -B global/mcp/mcp_render_test.py "$RUNNER_TEMP/mcp"
          echo "security calls (probe):"; cat "$PMHWC_SECURITY_CALL_LOG" 2>/dev/null || echo "(none)"

  # install.ps1 on a real Windows host (Issue #9, ADR-0010). Throwaway USERPROFILEs under RUNNER_TEMP
  # only. Runs under Windows PowerShell 5.1 (what a stock Windows has) and PowerShell 7. The runner's git
  # checks out with core.autocrlf=true, so this also exercises a CRLF source tree.
  windows:
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: installer suite (install.ps1 under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          git config --get core.autocrlf
          & $env:PS_EXE -NoProfile -Command '$PSVersionTable | Format-Table -AutoSize | Out-String'
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File global\install.test.ps1 "$env:RUNNER_TEMP\install-$env:PS_EXE"
          exit $LASTEXITCODE
      # Issue #68, ADR-0034: the npm package on Windows. git archive of HEAD (what GitHub serves, with
      # .workstation-archive filled in), npm pack, npm install -g into a throwaway prefix and cache; its
      # postinstall runs install.ps1 under ${{ matrix.ps }} against a throwaway USERPROFILE (set BEFORE
      # npm runs), then mhw.cmd and the deprecated workstation.cmd alias. No registry is contacted.
      - name: npm package (npm install -g into a throwaway prefix; postinstall, then mhw under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$m) { Write-Output "FAIL  $m"; exit 1 }
          node --version; npm --version
          $t = Join-Path $env:RUNNER_TEMP "npm-$env:PS_EXE"
          $prefix = Join-Path $t 'prefix'; $cache = Join-Path $t 'cache'; $prof = Join-Path $t 'profile'
          $src = Join-Path $t 'src'
          New-Item -ItemType Directory -Force -Path $t, $prefix, $prof, $src | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          git archive --format=tar -o (Join-Path $t 'src.tar') HEAD
          if ($LASTEXITCODE) { Fail 'git archive' }
          tar -xf (Join-Path $t 'src.tar') -C $src
          if ($LASTEXITCODE) { Fail 'tar -x' }
          Push-Location $src
          npm pack --pack-destination $t --cache $cache
          if ($LASTEXITCODE) { Fail 'npm pack' }
          Pop-Location
          $tgz = (Get-ChildItem -LiteralPath $t -Filter '*.tgz' | Select-Object -First 1).FullName
          # mhw install writes the user layer (the postinstall installs nothing, #113): point every
          # user-level path at the throwaway profile first.
          $env:USERPROFILE = $prof; $env:HOME = $prof; $env:CODEX_HOME = Join-Path $prof '.codex'
          $env:WORKSTATION_POWERSHELL = (Get-Command $env:PS_EXE -CommandType Application | Select-Object -First 1).Source
          $env:MHW_POSTINSTALL_TTY = '0'
          Push-Location $env:RUNNER_TEMP
          npm install -g --offline --foreground-scripts --prefix $prefix --cache $cache $tgz
          if ($LASTEXITCODE) { Fail 'npm install -g' }
          $pkg = Join-Path $prefix 'node_modules\mhw'
          if (Test-Path -LiteralPath (Join-Path $pkg '.git')) { Fail 'the installed package carries .git' }
          $archive = (Get-Content -LiteralPath (Join-Path $pkg '.workstation-archive')) -join ' | '
          if (-not $archive.Contains("commit: $sha")) { Fail "the archive stamp is not filled in: $archive" }
          $stamp = "commit: $sha"
          if (Test-Path -LiteralPath (Join-Path $prof '.claude\CLAUDE.md')) { Fail 'the postinstall installed the brief (#113: it installs nothing)' }
          $mhw = Join-Path $prefix 'mhw.cmd'
          & $mhw install
          if ($LASTEXITCODE) { Fail "mhw install exited $LASTEXITCODE" }
          $brief = Get-Content -LiteralPath (Join-Path $prof '.claude\CLAUDE.md') -TotalCount 1
          if (-not $brief.Contains("; release: ") -or -not $brief.Contains("; $stamp;")) { Fail "mhw install did not install the stamped brief: $brief" }
          & $mhw check
          if ($LASTEXITCODE) { Fail "mhw check exited $LASTEXITCODE" }
          $alias = Join-Path $prefix 'workstation.cmd'
          $notice = Join-Path $t 'alias.err'
          & $alias check 2> $notice
          if ($LASTEXITCODE) { Fail "workstation check (alias) exited $LASTEXITCODE" }
          $err = Get-Content -LiteralPath $notice -Raw
          if (-not $err.Contains('is renamed')) { Fail "the alias printed no rename notice: $err" }
          $out = (& $mhw update v4.2.0) -join ' | '
          if ($LASTEXITCODE -or -not $out.Contains('npm install -g github:tedeuxx/mhw#v4.2.0')) { Fail "update: $out" }
          & $mhw uninstall 2>$null
          if ($LASTEXITCODE -ne 2) { Fail "uninstall should be refused on Windows, exited $LASTEXITCODE" }
          Pop-Location
          Write-Output "PASS  npm package under $env:PS_EXE ($brief)"
          exit 0
