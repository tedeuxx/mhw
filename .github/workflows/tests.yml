# Run the installer and hook suites, and shellcheck, on every PR into main or into the rc/next
# integration branch that slice PRs target (ADR-0013).
# Every test writes only under $RUNNER_TEMP: throwaway HOMEs, never a real one.
name: tests

on:
  pull_request:
    branches: [main, rc/next]

permissions: {}

jobs:
  # Stable mechanical gate for the workspace's checked merge command.
  delivery-ci:
    if: always()
    needs: [shellcheck, profiles, suites, node, git-route, windows, isolation-smoke, prod-canary-installed-not-enforced]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner image)
        run: |
          shellcheck --version
          shellcheck -s sh mhw global/install.sh global/install.test.sh \
            .github/scripts/prod-canary-container.sh
      # A workflow that is not valid YAML never loads: GitHub reports a "workflow file issue" on push
      # and no job runs, so nothing else in this file would notice (PR #141). Ruby and its bundled
      # YAML parser (Psych) are preinstalled on the runner image; nothing is fetched.
      - name: every workflow file parses as YAML (the runner's ruby; no third-party linter)
        run: |
          ruby --version
          ruby -ryaml -e 'files = Dir.glob(".github/workflows/*.{yml,yaml}").sort
          abort("no workflow files found") if files.empty?
          bad = 0
          files.each do |f|
            begin
              YAML.parse(File.read(f), filename: f)
              puts "ok    #{f}"
            rescue Psych::SyntaxError => e
              bad += 1
              puts "FAIL  #{e.message}"
            end
          end
          exit(bad.zero? ? 0 : 1)'
      - name: python compile check, warnings as errors (the runner's python3; no third-party linter)
        run: |
          python3 --version
          python3 -W error -c 'import sys
          for f in sys.argv[1:]:
              with open(f, encoding="utf-8") as fh:
                  compile(fh.read(), f, "exec")' \
            global/project-policy/reference/fixture/container_tests.py global/project-policy/reference/fixture/stg_stand_in_tests.py \
            global/project-policy/reference/fixture/fixture_app.py \
            global/workstation.py global/workstation_test.py \
            .github/scripts/prod_canary.py \
            test/helpers/s15-record.py test/helpers/s17-record.py test/helpers/s23-prose.py \
            global/npm_package_test.py
      - name: node syntax check of the npm launcher and postinstall (Issue #68)
        run: |
          node --version
          node --check bin/mhw.js
          node --check bin/postinstall.js

  # Issue #472 (S01 of #470): the Node CLI base. On the Active LTS line engines.node names (D11; 26 since
  # 2026-10-28, read from nodejs.org's release index on 2026-11-17), on all three operating systems:
  # npm ci (fails on a missing lockfile, or one out of step with package.json), npm audit at high, the
  # JSDoc type check (tsc --noEmit, strict) and node:test. Full history so the parity test's live arm can
  # extract the base revision it compares against; without it that arm skips and says why.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node v7.1.0 (verified with git ls-remote 2026-11-17: refs/tags/v7.1.0). No cache:
      # npm ci installs from the registry into the runner's own npm cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      # --ignore-scripts: no dependency's install script runs (Sonar githubactions:S6505). None of the
      # devDependencies needs one; mhw's own postinstall only prints a line on a global install.
      - name: npm ci (lockfile npm-shrinkwrap.json; refuses a missing or stale one)
        shell: bash
        run: |
          node --version; npm --version
          npm ci --no-fund --ignore-scripts
      - name: npm audit (high and above fails)
        shell: bash
        run: npm audit --audit-level=high
      - name: type check (tsc --noEmit over JSDoc, checkJs, strict)
        shell: bash
        run: npm run typecheck
      - name: node:test
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test
      # #481 (S10 of #470): the live arm of test/render/model-defaults.test.js compares the Node renderer
      # with the base revision's model_defaults.py, and only on the CPython its goldens were recorded from
      # (test/golden/S10/recorded-from.json). The runners carry other patch releases, so that CPython is
      # installed here, after npm test, for this step alone. MHW_S10_LIVE_REQUIRED=1 turns the version skip
      # into a failure while the base still holds model_defaults.py. POSIX only: the arm runs the base's
      # Python there.
      # actions/setup-python v6.3.0 (verified with git ls-remote 2026-11-19: refs/tags/v6.3.0).
      - if: runner.os != 'Windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.14.6
      - name: S10 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S10_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          node --test --test-name-pattern="^live|tomllib" test/render/model-defaults.test.js
      # #484 (S13 of #470): the live arm of test/render/mcp-golden.test.js runs the base revision's
      # mcp_render.py beside src/render/mcp.js on every case, on the same CPython (its json messages are in
      # the transcripts). MHW_S13_LIVE_REQUIRED=1 turns a skip into a failure while the base still holds it.
      - name: S13 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S13_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          node --test --test-name-pattern="^live" test/render/mcp-golden.test.js
      # #485 (S14 of #470): the live arm of test/mcp/active-golden.test.js runs the base revision's
      # mcp_active.py and mcp_connect.py (through its src/render/mcp.js --active) beside the Node active set
      # and connection check on every case, on the same CPython. MHW_S14_LIVE_REQUIRED=1 turns a skip into a
      # failure while the base still holds mcp_active.py. The node:test files are named one by one: a
      # directory argument does not load them. The base is found as the test finds it (MHW_PARITY_BASE, else
      # the merge-base with origin/<base branch>); no base fails. While that base holds mcp_active.py the
      # live line must be reported and not as SKIP; once it does not, the live arm has retired and passes.
      - name: S14 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S14_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/mcp/active-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/mcp/mcp_active.py" 2>/dev/null; then
            echo "S14 live arm retired: base $base no longer holds global/mcp/mcp_active.py"
            exit 0
          fi
          echo "$out" | grep -E '^ *ok [0-9]+ - live: mcp_active\.py' | grep -vq SKIP
      # ADR-0017, 2026-10-05 amendment (restored by #484 after the agents-lead lens on PR #520): the one test
      # that runs the production MCP launcher against the real /usr/bin/security, on this ephemeral macOS
      # runner only, in a throwaway keychain the test creates and deletes under RUNNER_TEMP with a throwaway
      # HOME. PMHWC_REAL_KEYCHAIN_TESTS=1 is set here and nowhere else. The step fails if the arm skipped.
      - name: MCP launcher against the real security binary (macOS runner only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          PMHWC_REAL_KEYCHAIN_TESTS: "1"
        run: |
          out=$(node --test --test-reporter=tap --test-name-pattern="real security binary" test/render/mcp.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -E '^ *ok [0-9]+ - a keychain secret reaches only the server' | grep -vq SKIP
      # #486 (S15 of #470): the live arms of the cleaning core and mhw scan against the same CPython:
      # the shared corpus answered by clipboard_guard.py (the base revision's copy since #488 deleted it), the base revision's
      # scan.py on the same repositories, and a fresh recording of every Unicode table clean.js pins
      # (about two minutes). MHW_S15_LIVE_REQUIRED=1 turns any skip of the three into a failure.
      - name: S15 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S15_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          node --test --test-name-pattern="^live" test/clean/clean.test.js test/clean/unicode.test.js test/scan/scan.test.js
      # #487 (S16 of #470): the live arm of the paste wrapper's parity test plays the recorded cases on the
      # base revision's paste_wrapper.py with the same CPython. MHW_S16_LIVE_REQUIRED=1 turns a skip into a
      # failure while the base still holds it.
      - name: S16 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S16_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          node --test --test-name-pattern="^live" test/clipboard/paste-wrapper-golden.test.js
      # #487: the live relay tests run a real wrapper between a pty the suite owns and a fake CLI, through
      # the vendored node-pty: its macOS prebuilds from npm, and on Linux the pty.node node-pty-linux.yml
      # built from the pinned source (ADR-0042). MHW_S16_LIVE_REQUIRED=1 turns a pty that does not load
      # into a failure. Windows is not measured (D7): there the tests skip and the refusal tests run.
      - name: S16 live relay through the vendored pty (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S16_LIVE_REQUIRED: "1"
        run: |
          node --test --test-name-pattern="^live" test/clipboard/paste-wrapper.test.js
          node bin/mhw.js paste-wrapper check
      # #488 (S17 of #470): the prompt hook's parity golden played live on the base revision's
      # clipboard_guard.py with the same CPython while the base still holds it, and add-term on a real pty
      # (echo off, Ctrl+C, Ctrl+D, terminal modes restored). MHW_S17_LIVE_REQUIRED=1 turns a skip into a
      # failure: a missing base or interpreter while the base holds the original, or a pty that does not load.
      - name: S17 live parity and add-term on a pty
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S17_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/clipboard/hook-golden.test.js test/clipboard/hook.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          # The two pty arms must have run (the golden arm may skip once the base no longer holds the original).
          for name in "live: add-term reads the term twice with nothing echoed" "live: Ctrl+C and Ctrl+D cancel add-term cleanly"; do
            echo "$out" | grep -F "ok " | grep -F "$name" | grep -vq SKIP || { echo "SKIPPED or missing: $name"; exit 1; }
          done
      # #493 (S22 of #470): the live arm of test/status/status-golden.test.js runs the base revision's
      # status view (global/workstation.py and owner_actions.py) beside src/commands/status.js on every case,
      # in throwaway HOMEs and admin roots with a stand-in gh, on the same CPython. MHW_S22_LIVE_REQUIRED=1
      # turns a skip into a failure while the base still holds owner_actions.py; once it does not (this slice
      # has merged), the step says the arm retired and passes, as the S14 step does (#534). A missing base
      # fails. The golden arm runs in npm test, on macOS, where its transcripts were recorded.
      - name: S22 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S22_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/status/status-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/owner_actions.py" 2>/dev/null; then
            echo "S22 live arm retired: base $base no longer holds global/owner_actions.py"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the status view" | grep -vq SKIP
      # #494 (S23 of #470): the live arms of test/check/check-golden.test.js and test/check/prose-corpus.test.js
      # run the base revision's mhw check (global/workstation.py, prerequisites.py and merge_authority.py)
      # beside src/commands/check.js on every case, in throwaway HOMEs and admin roots with a stand-in gh and a
      # loopback stand-in service, and the base's merge_authority.py over the live-prose corpus, on the same
      # CPython. MHW_S23_LIVE_REQUIRED=1 turns a skip into a failure while the base still holds
      # merge_authority.py; once it does not (this slice has merged), the step says the arm retired and
      # passes, as the S14 and S22 steps do (#534). A missing base fails. The golden arms run in npm test.
      - name: S23 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S23_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/check/check-golden.test.js test/check/prose-corpus.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/merge_authority.py" 2>/dev/null; then
            echo "S23 live arm retired: base $base no longer holds global/merge_authority.py"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the check of the base revision" | grep -vq SKIP
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the base revision" | grep -vq SKIP

      # #489 (S18 of #470): the two live arms of test/render/method-golden.test.js run the base revision's
      # method_render.py beside src/render/method.js, on every golden case and on this repository's own
      # method/, in throwaway HOMEs, on the same CPython. MHW_S18_LIVE_REQUIRED=1 turns a skip into a failure
      # while the base still holds method_render.py; once it does not (this slice has merged), the step says
      # the arm retired and passes, as the S14 step does (#534). A missing base fails. The golden arm runs in
      # npm test on every OS.
      - name: S18 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S18_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/render/method-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/method/method_render.py" 2>/dev/null; then
            echo "S18 live arm retired: base $base no longer holds global/method/method_render.py"
            exit 0
          fi
          [ "$(echo "$out" | grep -E "^ *ok [0-9]+ - live: " | grep -vc SKIP)" = 2 ]
      # #498 (S28 of #470): the live arm of test/project-policy/project-policy-golden.test.js runs the base
      # revision's `./mhw policy` (global/workstation.py and project_policy.py) beside the Node command on every
      # case, in throwaway directories, on the same CPython (its json messages are in the transcripts).
      # MHW_S28_LIVE_REQUIRED=1 turns a skip into a failure while the base still holds project_policy.py; once
      # it does not (this slice has merged), the step says the arm retired and passes, as the S14 step does
      # (#534). A missing base fails. The golden arm runs in npm test on every OS.
      - name: S28 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S28_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/project-policy/project-policy-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/project-policy/project_policy.py" 2>/dev/null; then
            echo "S28 live arm retired: base $base no longer holds global/project-policy/project_policy.py"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the Python original and the Node command" | grep -vq SKIP
      # #500 (S30 of #470): the live arm of test/ci/method-issue-sync-golden.test.js runs the base revision's
      # method_issue_sync.py with its own suite's Python stub gh beside .github/scripts/method-issue-sync.js
      # with the JavaScript stub, on every case, on the same CPython. MHW_S30_LIVE_REQUIRED=1 turns a skip
      # into a failure while the base still holds method_issue_sync.py; once it does not (this slice has
      # merged), the step says the arm retired and passes, as the S14 step does (#534). A missing base fails.
      # The golden arm runs in npm test on macOS and Linux (the stub gh is a POSIX executable).
      - name: S30 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S30_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/ci/method-issue-sync-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:.github/scripts/method_issue_sync.py" 2>/dev/null; then
            echo "S30 live arm retired: base $base no longer holds .github/scripts/method_issue_sync.py"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the original" | grep -vq SKIP

      # #499 (S29 of #470): the live arm of test/project-policy/delivery-gate-golden.test.js runs the base
      # revision's global/project-policy/delivery_gate.py (which runs the base's `node bin/mhw.js policy
      # check` with PATH's node) beside `mhw delivery-gate` on every case, in throwaway directories, on the
      # same CPython (its json and UTF-8 messages are in the transcripts). MHW_S29_LIVE_REQUIRED=1 turns a
      # skip into a failure while the base still holds delivery_gate.py; once it does not (this slice has
      # merged), the step says the arm retired and passes, as the S14 step does (#534). A missing base
      # fails. The golden arm runs in npm test on every OS.
      - name: S29 live parity against the recorded CPython
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S29_LIVE_REQUIRED: "1"
        run: |
          python3 --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/project-policy/delivery-gate-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git cat-file -e "$base:global/project-policy/delivery_gate.py" 2>/dev/null; then
            echo "S29 live arm retired: base $base no longer holds global/project-policy/delivery_gate.py"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the Python original and the Node command" | grep -vq SKIP

      # #491 (S20 of #470): the live arm of test/render/settings-merge-golden.test.js runs the base revision's
      # merge_settings, uninstall_user and report_floor (jq programs) beside the head's, which run
      # src/render/settings-merge.js and src/render/floor-report.js, on every case, in throwaway HOMEs and admin
      # roots. MHW_S20_LIVE_REQUIRED=1 is the requirement: while the base's install.sh still merges with jq
      # the live line must be reported and not as SKIP; once it does not (this slice has merged), the step
      # says the arm retired and passes, as the S14 step does (#534). A missing base fails. The golden arm
      # runs in npm test on macOS and Linux.
      - name: S20 live parity against the jq programs
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S20_LIVE_REQUIRED: "1"
        run: |
          jq --version
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/render/settings-merge-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git show "$base:global/install.sh" 2>/dev/null | grep -qF 'jq is required to merge the hook entry and the deny floor'; then
            echo "S20 live arm retired: base $base no longer merges settings.json with jq"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the Node steps match" | grep -vq SKIP

      # #492 (S21 of #470): the live arm of test/render/shell-rc-golden.test.js runs the base revision's
      # rc_* and shell_rc_* functions (shell and awk) beside the head's startup_step, which runs
      # src/render/shell-rc.js, on every case, in throwaway HOMEs. MHW_S21_LIVE_REQUIRED=1 is the
      # requirement: while the base's install.sh still holds rc_scan the live line must be reported and not
      # as SKIP; once it does not (this slice has merged), the step says the arm retired and passes, as the
      # S14 step does (#534). A missing base fails. The golden arm runs in npm test on macOS and Linux.
      - name: S21 live parity against the shell functions
        if: runner.os != 'Windows'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MHW_S21_LIVE_REQUIRED: "1"
        run: |
          base="${MHW_PARITY_BASE:-$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-rc/next}")}" || { echo "no base revision"; exit 1; }
          [ -n "$base" ] || { echo "no base revision"; exit 1; }
          out=$(node --test --test-reporter=tap --test-name-pattern="^live" test/render/shell-rc-golden.test.js) || { echo "$out"; exit 1; }
          echo "$out"
          if ! git show "$base:global/install.sh" 2>/dev/null | grep -qF 'rc_scan() {'; then
            echo "S21 live arm retired: base $base no longer holds the shell functions"
            exit 0
          fi
          echo "$out" | grep -E "^ *ok [0-9]+ - live: the Node step matches" | grep -vq SKIP

  # Issue #472: the git install route of ADR-0034 (`npm install -g github:...` is a git dependency to
  # npm), through git+file:// of a commit made from this checkout, into a throwaway prefix, cache and
  # HOME. Fails on any `npm ls -g --all` problem (an UNMET DEPENDENCY among them), on an installed
  # package that cannot load its TOML module, or on an installed devDependency. The install is
  # --offline with an empty cache and needs nothing from the registry (measured with npm 11.13.0,
  # git+file:// only; the github: route itself was not measured). node:test runs it in the node job
  # too; this job keeps the route a named check of its own.
  git-route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Node 26, the engines.node floor (#472), instead of the runner's preinstalled node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - name: npm install -g git+file:// of this checkout, then npm ls -g --all
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node --version; npm --version; git --version
          node --test test/git-route.test.js

  # Pure preference compilation and contract checks: no harness installation, account calls or
  # credential reads.
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Node 26, the engines.node floor (#472). The compiler is `mhw profile` (#479); its suite runs in the
      # node job (npm test, test/profile/). This step is the byte-for-byte guard on all three OSes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - name: the committed overlay is what mhw profile generates (byte for byte)
        shell: bash
        run: |
          node --version
          node bin/mhw.js profile check --source overlay/profile.json --output overlay
      # Issues #244 to #247, ADR-0015 locks 2 to 5: the contract, its validator (`mhw policy check`, #498),
      # the reference CI/CD's evidence gates and the recovery reference's gates and template jobs
      # (`mhw delivery-gate`, #499) are all Node: test/project-policy/, in npm test on all three OSes. The
      # dry run of the workflow itself is reference-delivery-dry-run.yml.

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Node 26, the engines.node floor (#472), instead of the runner's preinstalled node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      # Evidence for Principle 1 (Issue #9): which POSIX sh runs the suites. On ubuntu /bin/sh is dash,
      # the strictest common POSIX sh; this step fails if that ever stops being true, so a green ubuntu
      # run is a dash run. On macOS /bin/sh is bash in POSIX mode.
      # PR #146 lens H1: install writes the paste wrapper block into ${ZDOTDIR:-~}/.zshrc. Every suite
      # below runs with ZDOTDIR exported to a sentinel outside its throwaway HOMEs, and SHELL set to zsh,
      # the worst case; the last step fails if anything was written there.
      - name: export a ZDOTDIR sentinel the suites must never write
        run: |
          mkdir -p "$RUNNER_TEMP/zdotdir-sentinel"
          echo "ZDOTDIR=$RUNNER_TEMP/zdotdir-sentinel" >> "$GITHUB_ENV"
          echo "SHELL=/bin/zsh" >> "$GITHUB_ENV"
      - name: which /bin/sh runs the suites
        run: |
          ls -l /bin/sh
          if [ "$RUNNER_OS" = Linux ]; then
            target=$(readlink -f /bin/sh)
            echo "/bin/sh -> $target"
            [ "$(basename "$target")" = dash ] || { echo "expected dash as /bin/sh on Linux"; exit 1; }
          fi
      - name: installer suite
        run: sh global/install.test.sh "$RUNNER_TEMP/install"
      # Issue #83, ADR-0031: the allow list is Node since #490 (S19 of #470); its suite,
      # test/render/allow-list*.test.js, runs in the node job (npm test) on all three OSes, the install.sh
      # arms on macOS and Linux. The settings merge and the FLOOR report are Node since #491 (S20 of #470):
      # test/render/settings-merge*.test.js carries the installer suite's merge cases as node:test, in the
      # node job; this suite still runs them through install.sh as before.
      - name: admin-layer installer suite (throwaway --root; never a system path, never root, ADR-0025)
        run: sh global/install-managed.test.sh "$RUNNER_TEMP/managed"
      # Issues #57 and #67: ./mhw install, check, update and uninstall in a throwaway HOME and admin root
      # (TMPDIR under RUNNER_TEMP). The status view and the version key are Node since #493 (S22 of #470):
      # test/status/*.test.js, in the node job (npm test) and its S22 live step.
      - name: ./mhw suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B global/workstation_test.py
      # Issue #195: the merge-authority contract is Node since #494 (S23 of #470): the method's operational
      # copies against the canonical contract and mhw check --project=DIR against synthetic briefs,
      # test/check/merge-authority.test.js, in the node job (npm test) on all three OSes.
      # Issue #224: Chrome's remote-debugging key in Local State is Node since #480 (mhw chrome-debugging);
      # its suite, on fixture files only, runs in the node job (npm test, test/render/chrome-debugging.test.js).
      # ADR-0035 decision 7: mhw scan, the outbound scan, is Node since #486 (S15 of #470); its suites
      # (test/scan/, test/clean/) run in the node job (npm test) on all three OSes, and their live arms
      # against the recorded CPython in that job's S15 step.
      # Issue #61, ADR-0032: the working-method renderer is Node since #489 (S18 of #470); its suite,
      # test/render/method.test.js (every rendered agent keeps its tool list and every rendered file its
      # provenance stamp, in throwaway HOMEs only), runs in the node job (npm test) on all three OSes.
      # ADR-0035: the session-start model and effort defaults are Node since #481 (S10 of #470); their
      # suite, test/render/model-defaults.test.js, runs in the node job (npm test) on all three OSes.
      # Issue #145: the backup helper is Node since #484 (src/lib/private-copy.js, its last Python user gone);
      # test/lib/private-copy.test.js runs it and install.sh's shell form on the same cases, in the node job.
      # Issue #144, ADR-0036: the Kiro deny floor suite is node:test since #482 (S11 of #470),
      # test/render/kiro-permissions*.test.js, run by the node job on all three OSes.
      # Issues #71-#75 (node:test since #489, S18 of #470: test/render/method-commands.test.js, in the node job;
      # its text checks run on src/lib/clean.js directly): the workflow commands render on all three agent harnesses with their required
      # sections, Codex implicit invocation off (four since #196 removed /handover, five with #198's
      # /handoff); the sanitisation check on a synthetic fixture, kept after that removal because it never
      # reads the command file. #198: each /handoff carrier defaults to its own agent harness, an explicit
      # first-word target overrides it, mhw launch-line (launch-line.py until #476) prints one fenced block for the
      # target, the block parses under sh, bash (and zsh where present) and carries the prompt (quotes,
      # $, backticks, newlines) and the launch environment exactly, and no rendering token survives.
      # #454: both /handoff templates (continuation and ask) and the fallback reach every carrier, and the
      # ask template, filled, passes mhw launch-line for each target. Text checks plus one script run.
      # /need-me (owner, 2026-10-26): its headings and phrases reach every carrier; its source text (front matter included, markup stripped)
      # carries no four-option ceiling and names exactly three options; it confirms the owner-action label
      # before reading an empty list as zero, against the status reader's repository and label (owner-actions.js); and its
      # source names no Issue-creating or label-adding command. These are text checks, not behaviour.
      # /backlog-grooming (#522): its headings and phrases reach every carrier; its source names no milestone
      # write, no Issue creation and no merge; no tracker write precedes its one activation, which offers
      # exactly three options; and sprint-planning steps 0 and 1 and autonomy read loop-mode-repos. Text checks.
      # Issue #68, ADR-0034: the npm package. What GitHub serves (this tree, with .workstation-archive as
      # git archive fills it in) is npm-packed and installed with npm install -g into a throwaway prefix
      # and cache; its postinstall installs the user layer in a throwaway HOME and admin root, also through
      # npm's git-dependency preparation (git+file://), with --ignore-scripts and as a local dependency;
      # plus the launcher's Windows mapping with a stub PowerShell (the workstation alias left with #206).
      # Node 26 (setup-node above) and its npm; nothing is fetched from or published to a registry:
      # since #472 the package has no npm runtime dependency (the TOML library is vendored).
      - name: npm package suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node --version; npm --version
          python3 -B global/npm_package_test.py
      # Issue #89: the prerequisites section of mhw check is Node since #494 (S23 of #470); its suite,
      # test/check/prerequisites.test.js (fake tool shims, a stub gh, a loopback stand-in for SonarCloud and
      # HCP Terraform; no network, no account), runs in the node job (npm test).
      # Issue #62, ADR-0032 2026-10-12 amendment: the method backlog sync. Its suite is node:test since #500
      # (S30 of #470): test/ci/method-issue-sync.test.js (the workflow's structure, parsed with the runner's
      # ruby, and the agent's only route to GitHub, .github/scripts/method-issue-sync.js, against a stub gh
      # on PATH; no network) and its goldens, in the node job (npm test) and its S30 live step.
      # #170: the scripts the moved rites run, with their own suites (moved from the plugin with them).
      # #128: the rite-cadence dater of session check 3, in throwaway git repositories.
      # #475: the milestone routes are Node now; their suite runs in the node job (npm test).
      # #476: so are mhw worklog and mhw launch-line (test/method/worklog.test.js and the S05 goldens).
      # #477: so is rite-cadence (mhw rite-cadence, test/method/rite-cadence.test.js).
      # #478: and mhw funnel-review (test/method/funnel-review.test.js and the S07 goldens). With both moved,
      # the method scripts step had nothing left to run and was removed.
      # ADR-0011, the paste filter: its prompt hook is Node since #488 (S17 of #470), src/commands/hook-prompt.js;
      # its suites, test/clipboard/hook.test.js and hook-golden.test.js, run in the node job on all three
      # OSes, and their live arms in that job's S17 step. The salt is a file since #488 (owner ruling,
      # 2026-11-21), so no suite reads a Keychain for it any more.
      # ADR-0017: the MCP renderer is Node since #484 (S13 of #470), src/render/mcp.js; its suites,
      # test/render/mcp.test.js and test/render/mcp-golden.test.js, run in the node job on all three OSes, on
      # the Node security stub; the one real-binary arm runs in the node job on macOS only, by opt-in.
      - name: nothing was written into the exported ZDOTDIR sentinel
        if: always()
        run: |
          echo "ZDOTDIR=$ZDOTDIR"
          find "$ZDOTDIR" -mindepth 1 -print
          [ -z "$(find "$ZDOTDIR" -mindepth 1 -print)" ]

  # Issue #62: method-issue-sync.yml's subprocess isolation recipe (bubblewrap, socat, the AppArmor
  # user-namespace sysctl, and an unprivileged-namespace smoke test), run on ubuntu-latest so a PR measures
  # it without a trip to main. test/ci/method-issue-sync.test.js keeps this script identical to the workflow's.
  isolation-smoke:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install subprocess isolation dependencies (same script as method-issue-sync.yml)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor; the sysctl is absent on older
          # kernels, which is fine. Guarded as the action's own step guards it.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && command -v sudo >/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          # Smoke test: an unprivileged user namespace actually opens. Red here names the cause.
          bwrap --unshare-user --ro-bind / / /bin/true

  # Issue #452, ADR-0015 2026-11-08 amendment (~~proposed~~ accepted 2026-11-18, #506): the PROD
  # install canary. mhw's PROD is the owner's own install, so this installs the npm package packed
  # from the exact PR head the way GitHub serves a tag (git archive, then npm pack), fresh and as an upgrade from the latest published tag,
  # then checks it: the deny floor in the Claude Code, Codex and Kiro carriers (and the admin layer, in
  # a throwaway root) equals deny-floor.conf; the installed prompt hook blocks a synthetic credential and
  # passes a clean prompt with the paste-wrapper marker unset; mhw status and check; uninstall restores.
  # Linux: a clean container whose image is pinned by digest (the convention of
  # reference-delivery-gate.yml, nothing else of that gate). macOS: the same script, throwaway HOME.
  # EVIDENCE LEVEL: installed, never enforced. No agent harness session runs, so nothing here shows a
  # rule is loaded or enforced; the real /Library or /etc managed layer and the Keychain are not reached.
  prod-canary-installed-not-enforced:
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux-container
            os: ubuntu-latest
          - where: macos-throwaway-home
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # node:26.13.1-bookworm (the engines.node floor, #472), the multi-architecture index digest, read
      # from registry-1.docker.io on 2026-11-18 (linux/amd64 and linux/arm64 in the index). It replaced
      # node:22-bookworm @ sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f.
      CANARY_IMAGE: docker.io/library/node@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01).
      # The exact head (not the merge ref), and every tag, to find the latest published one.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Node 26, the engines.node floor (#472), instead of the runner's preinstalled node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - name: pack the head and the latest published tag (git archive, then npm pack, as GitHub serves a tag)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -eu
          node --version; npm --version
          head=$(git rev-parse HEAD)
          from=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          printf '%s\n' "$from" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "no published tag found"; exit 1; }
          echo "head $head; upgrade from $from"
          pkg="$RUNNER_TEMP/prod-canary-pkg"
          python3 -B .github/scripts/prod_canary.py pack --ref "$head" --name HEAD --out "$pkg"
          python3 -B .github/scripts/prod_canary.py pack --ref "$from" --name from --out "$pkg"
          echo "CANARY_PKG=$pkg" >> "$GITHUB_ENV"
          echo "CANARY_HEAD=$head" >> "$GITHUB_ENV"
      - name: canary in a clean digest-pinned container, fresh install (installed evidence)
        if: runner.os == 'Linux'
        run: sh .github/scripts/prod-canary-container.sh "$CANARY_IMAGE" "$CANARY_PKG" "$CANARY_HEAD" fresh
      - name: canary in a clean digest-pinned container, upgrade from the latest published tag (installed evidence)
        if: runner.os == 'Linux'
        run: sh .github/scripts/prod-canary-container.sh "$CANARY_IMAGE" "$CANARY_PKG" "$CANARY_HEAD" upgrade
      - name: canary in a throwaway HOME on macOS, fresh and upgrade (installed evidence)
        if: runner.os == 'macOS'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -eu
          python3 --version; jq --version
          python3 -B .github/scripts/prod_canary.py run --source "$CANARY_PKG/src-HEAD" --tgz "$CANARY_PKG/mhw-HEAD.tgz" \
            --work "$RUNNER_TEMP/prod-canary-fresh" --commit "$CANARY_HEAD"
          python3 -B .github/scripts/prod_canary.py run --source "$CANARY_PKG/src-HEAD" --tgz "$CANARY_PKG/mhw-HEAD.tgz" \
            --from-tgz "$CANARY_PKG/mhw-from.tgz" --work "$RUNNER_TEMP/prod-canary-upgrade" --commit "$CANARY_HEAD"

  # install.ps1 on a real Windows host (Issue #9, ADR-0010). Throwaway USERPROFILEs under RUNNER_TEMP
  # only. Runs under Windows PowerShell 5.1 (what a stock Windows has) and PowerShell 7. The runner's git
  # checks out with core.autocrlf=true, so this also exercises a CRLF source tree.
  windows:
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as version-main.yml, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Node 26, the engines.node floor (#472), instead of the runner's preinstalled node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - name: installer suite (install.ps1 under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          git config --get core.autocrlf
          & $env:PS_EXE -NoProfile -Command '$PSVersionTable | Format-Table -AutoSize | Out-String'
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File global\install.test.ps1 "$env:RUNNER_TEMP\install-$env:PS_EXE"
          exit $LASTEXITCODE
      # Issue #68, ADR-0034: the npm package on Windows. git archive of HEAD (what GitHub serves, with
      # .workstation-archive filled in), npm pack, npm install -g into a throwaway prefix and cache; its
      # postinstall runs install.ps1 under ${{ matrix.ps }} against a throwaway USERPROFILE (set BEFORE
      # npm runs), then mhw.cmd; no workstation.cmd alias since #206. No registry is contacted.
      - name: npm package (npm install -g into a throwaway prefix; postinstall, then mhw under ${{ matrix.ps }})
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$m) { Write-Output "FAIL  $m"; exit 1 }
          node --version; npm --version
          $t = Join-Path $env:RUNNER_TEMP "npm-$env:PS_EXE"
          $prefix = Join-Path $t 'prefix'; $cache = Join-Path $t 'cache'; $prof = Join-Path $t 'profile'
          $src = Join-Path $t 'src'
          New-Item -ItemType Directory -Force -Path $t, $prefix, $prof, $src | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          git archive --format=tar -o (Join-Path $t 'src.tar') HEAD
          if ($LASTEXITCODE) { Fail 'git archive' }
          tar -xf (Join-Path $t 'src.tar') -C $src
          if ($LASTEXITCODE) { Fail 'tar -x' }
          Push-Location $src
          npm pack --pack-destination $t --cache $cache
          if ($LASTEXITCODE) { Fail 'npm pack' }
          Pop-Location
          $tgz = (Get-ChildItem -LiteralPath $t -Filter '*.tgz' | Select-Object -First 1).FullName
          # mhw install writes the user layer (the postinstall installs nothing, #113): point every
          # user-level path at the throwaway profile first.
          $env:USERPROFILE = $prof; $env:HOME = $prof; $env:CODEX_HOME = Join-Path $prof '.codex'
          $env:WORKSTATION_POWERSHELL = (Get-Command $env:PS_EXE -CommandType Application | Select-Object -First 1).Source
          $env:MHW_POSTINSTALL_TTY = '0'
          Push-Location $env:RUNNER_TEMP
          npm install -g --offline --foreground-scripts --prefix $prefix --cache $cache $tgz
          if ($LASTEXITCODE) { Fail 'npm install -g' }
          $pkg = Join-Path $prefix 'node_modules\mhw'
          if (Test-Path -LiteralPath (Join-Path $pkg '.git')) { Fail 'the installed package carries .git' }
          $archive = (Get-Content -LiteralPath (Join-Path $pkg '.workstation-archive')) -join ' | '
          if (-not $archive.Contains("commit: $sha")) { Fail "the archive stamp is not filled in: $archive" }
          $stamp = "commit: $sha"
          if (Test-Path -LiteralPath (Join-Path $prof '.claude\CLAUDE.md')) { Fail 'the postinstall installed the brief (#113: it installs nothing)' }
          $mhw = Join-Path $prefix 'mhw.cmd'
          & $mhw install
          if ($LASTEXITCODE) { Fail "mhw install exited $LASTEXITCODE" }
          $brief = Get-Content -LiteralPath (Join-Path $prof '.claude\CLAUDE.md') -TotalCount 1
          if (-not $brief.Contains("; release: ") -or -not $brief.Contains("; $stamp;")) { Fail "mhw install did not install the stamped brief: $brief" }
          & $mhw check
          if ($LASTEXITCODE) { Fail "mhw check exited $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $prefix 'workstation.cmd')) { Fail 'the removed workstation alias was installed (#206)' }
          $out = (& $mhw update v4.2.0) -join ' | '
          if ($LASTEXITCODE -or -not $out.Contains('npm install -g github:tedeuxx/mhw#v4.2.0')) { Fail "update: $out" }
          & $mhw uninstall 2>$null
          if ($LASTEXITCODE -ne 2) { Fail "uninstall should be refused on Windows, exited $LASTEXITCODE" }
          Pop-Location
          Write-Output "PASS  npm package under $env:PS_EXE ($brief)"
          exit 0
