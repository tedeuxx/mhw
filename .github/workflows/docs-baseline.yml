# The documentation baseline check (Issue #523) on every pull request into main or rc/next: every
# capability a change touches, per docs/documentation-baseline.json, must also change one of its
# documents by more than whitespace, or the pull-request body must carry a column-0
# `docs-baseline: none — <reason>` or `docs-baseline: in #N` line. A changed path outside every
# capability fails whatever the body says. It is not among delivery-ci's needs in tests.yml; the delivery
# rulesets require it by name (global/github-repo-settings.json, #591; mhw delivery merge did until then).
# It runs again when the body is edited, so adding an escape line re-decides. It is a check, not a
# hook: nothing stops a push, and a trivial doc edit or a dishonest escape still passes (ADR-0044).
# The check is a step of the delivery gates Action (#592, ADR-0046; it was `mhw docs-baseline check`),
# run here at this pull request's own ref through `uses: ./actions/delivery-gates`, as a project runs it
# through `uses: tedeuxx/mhw/actions/delivery-gates@<ref>`. It imports only node: modules, so nothing is
# installed from a registry here.
name: docs-baseline

on:
  pull_request:
    branches: [main, rc/next]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  docs-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.1.0 (same pin as tests.yml). The pull request's head commit, with full
      # history, so the merge base with the base branch exists.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: the pull request body, as a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: every touched capability changed a document, or the body says why not
        uses: ./actions/delivery-gates
        with:
          gate: docs-baseline
          base: origin/${{ github.base_ref }}
          body-file: ${{ runner.temp }}/pr-body.md
