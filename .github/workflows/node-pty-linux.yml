# The Linux node-pty prebuilds (#487; ADR-0042, owner decision on PR #521): node-pty 1.1.0 ships no Linux
# binary, so this job compiles pty.node from the exact pinned source, on the ephemeral runner only:
#   - the registry tarballs of node-pty 1.1.0 and node-addon-api 7.1.1 are fetched with npm pack
#     --ignore-scripts and checked against the integrity npm-shrinkwrap.json records; nothing from them runs
#     before that check, and no install script runs at all;
#   - node-gyp is the copy bundled with this runner's npm, and the Node headers are the ones setup-node
#     installed (--nodedir), so nothing else is downloaded for the build;
#   - the built pty.node goes into a copy of the checkout and the live relay tests run through it;
#   - the binary and its sha256 are published as a workflow artifact. mhw vendors the binary from a named
#     run of this job; test/vendor.test.js holds the committed file to the sha256 recorded with that run,
#     and this job reports whether its own build matches the committed one.
# Linux builds on Ubuntu 22.04 (glibc 2.35), so the binary also loads on newer glibc. No secret, no write
# permission.
name: node-pty-linux

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0 (verified with git ls-remote 2026-11-17: refs/tags/v7.1.0).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - name: fetch the pinned sources and check them against the shrinkwrap integrity
        shell: bash
        env:
          WORK: ${{ runner.temp }}/node-pty-build
        run: |
          set -euo pipefail
          mkdir -p "$WORK/pkg" "$WORK/cache"
          node --version; npm --version; uname -m
          ldd --version > "$WORK/ldd.txt"; head -n 1 "$WORK/ldd.txt"
          for spec in node-pty@1.1.0 node-addon-api@7.1.1; do
            npm pack "$spec" --ignore-scripts --pack-destination "$WORK/pkg" --cache "$WORK/cache" >/dev/null
          done
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto"), path = require("node:path");
            const lock = JSON.parse(fs.readFileSync("npm-shrinkwrap.json", "utf8"));
            for (const [name, file] of [["node-pty", "node-pty-1.1.0.tgz"], ["node-addon-api", "node-addon-api-7.1.1.tgz"]]) {
              const want = lock.packages["node_modules/" + name].integrity;
              const got = "sha512-" + crypto.createHash("sha512").update(fs.readFileSync(path.join(process.env.WORK, "pkg", file))).digest("base64");
              if (got !== want) { console.error(name + ": integrity " + got + " differs from npm-shrinkwrap.json, " + want); process.exit(1); }
              console.log(name + ": " + got + " (matches npm-shrinkwrap.json)");
            }'
      - name: build pty.node with node-gyp from npm, against the installed Node headers
        shell: bash
        env:
          WORK: ${{ runner.temp }}/node-pty-build
        run: |
          set -euo pipefail
          cd "$WORK"
          tar xzf pkg/node-pty-1.1.0.tgz
          mkdir -p package/node_modules/node-addon-api
          tar xzf pkg/node-addon-api-7.1.1.tgz -C package/node_modules/node-addon-api --strip-components=1
          node_dir=$(dirname "$(dirname "$(command -v node)")")
          gyp="$(dirname "$(dirname "$(readlink -f "$(command -v npm)")")")/node_modules/node-gyp/bin/node-gyp.js"
          node "$gyp" --version
          (cd package && node "$gyp" rebuild --nodedir="$node_dir")
          mkdir -p "$WORK/out/linux-${{ matrix.arch }}"
          cp package/build/Release/pty.node "$WORK/out/linux-${{ matrix.arch }}/pty.node"
          (cd "$WORK/out" && sha256sum "linux-${{ matrix.arch }}/pty.node" | tee "linux-${{ matrix.arch }}/pty.node.sha256")
          file "$WORK/out/linux-${{ matrix.arch }}/pty.node"
      - name: the live relay through the built binary, and how it compares with the committed one
        shell: bash
        env:
          WORK: ${{ runner.temp }}/node-pty-build
          TMPDIR: ${{ runner.temp }}
          MHW_S16_LIVE_REQUIRED: "1"
        run: |
          set -euo pipefail
          dest="src/vendor/node-pty/prebuilds/linux-${{ matrix.arch }}"
          built="$WORK/out/linux-${{ matrix.arch }}/pty.node"
          if [ -f "$dest/pty.node" ]; then
            if cmp -s "$built" "$dest/pty.node"; then echo "this build is byte-identical to the committed $dest/pty.node"
            else echo "this build differs from the committed $dest/pty.node (a rebuild is not byte-reproducible here); the committed file is held to its recorded sha256"; fi
          else
            echo "no committed $dest/pty.node yet"
          fi
          mkdir -p "$dest"
          cp "$built" "$dest/pty.node"
          node bin/mhw.js paste-wrapper check
          node --test --test-name-pattern="^live" test/clipboard/paste-wrapper.test.js
      # actions/upload-artifact, the same pin tests.yml uses.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-pty-1.1.0-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/node-pty-build/out/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90
