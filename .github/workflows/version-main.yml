# On every merged PR into main, bump the part named by its semver label and tag it (ADR-0002).
name: version-main

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve the bump part from the PR label
        id: part
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          parts="$(jq -r '.[] | select(test("^semver:(major|minor|patch)$")) | sub("^semver:"; "")' <<<"$LABELS")"
          if [ "$(printf '%s\n' "$parts" | grep -c .)" -ne 1 ]; then
            echo "::error::merged PR does not carry exactly one semver label; no version cut"
            exit 1
          fi
          echo "part=$parts" >> "$GITHUB_OUTPUT"

      # actions/checkout v6.1.0 (lightweight tag -> commit, verified with git ls-remote 2026-10-01)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          # Pushing to a protected main needs a token or ruleset bypass that does not exist yet (ADR-0002).
          # Until it exists, the default token is used and the push is refused by protection, loudly.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      # actions/setup-node v7.1.0 (same pin as tests.yml; verified with git ls-remote 2026-11-18:
      # refs/tags/v7.1.0). Node 26, the engines.node floor. No npm install runs in this job: the bump
      # script imports only node: modules and this repository's own files (the vendored TOML parser).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1

      # The Node bump (#473, ADR-0002 2026-11-18 amendment) replaced bump-my-version 1.5.1 here: same
      # commit message, tag name, tag message and file diff (test/release/bump.test.js). It prints the
      # new tag and nothing else on stdout; the step fails on any refusal, before the push.
      - name: Bump, commit and tag
        id: version
        env:
          PART: ${{ steps.part.outputs.part }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(node src/commands/release-bump.js "$PART" --git="$(command -v git)")"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the bump printed no numeric tag; nothing is pushed"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push the bump commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

      # Create the Release in this job: token-created tags do not trigger a second workflow.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
